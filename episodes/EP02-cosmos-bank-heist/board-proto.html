<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EP02 — Cosmos Bank Heist — Case File prototype</title>
<!--
  Unfiction · EP02 · Case File prototype. Ten board beats that exercise every Case File feature:
  the empty-board reveal, blank slots filling, thread types and muting, the counter and THE MONEY ledger,
  the alias fan-out, the card flip with stamps and struck clips, the pulse along the chain, the full
  board, the dive into a card, and the same board on the narrator's wall.
  The board itself lives in case-file.js; these scenes only say when things land and where the camera goes.

  SPACE play/pause · ←/→ previous/next · 1-9 jump · E export · SHIFT+E export all · K editorial check
-->
<script src="../../toolkit/core/uf-core.js"></script>
<script src="../../toolkit/core/uf-draw.js"></script>
<script src="../../toolkit/components/uf-overlays.js"></script>
<script src="../../toolkit/components/uf-props.js"></script>
<script src="../../toolkit/components/uf-character.js"></script>
<script src="../../toolkit/components/uf-sets.js"></script>
<script src="../../toolkit/components/uf-casefile.js"></script>
<script src="case-file.js"></script>
</head>
<body>
<script>
'use strict';

const board = (id, title, duration, o, extra = {}) => Object.assign({
  id, title, duration, pushIn: 0,
  layers: [new UF.CaseFileBoard(Object.assign({ file: CASE }, o))],
}, extra);

const scenes = [
  // L11 · "If you watched our last episode... his court papers name the bank."
  board('l11-reveal', 'L11 · BOARD · The empty case file', 16, {
    line: 'L11', hudAt: 3.0,
    camera: [
      { t: 0, center: '01', zoom: 2.3 },
      { t: 1.0, center: 'all', dur: 6.5, ease: 'inOutSine' },
      { t: 11.6, center: '06', zoom: 1.5, dur: 2.6, ease: 'inOutSine' },
    ],
  }),

  // L14 · "To understand how it was robbed..."  pins the bank, then dives into slot 04
  board('l14-enter-phase1', 'L14 · BOARD · Enter phase 1 (dive into slot 04)', 9, {
    line: 'L14', cues: { '02': 1.0 },
    camera: [{ t: 0, center: ['03', '04', '02'] }, { t: 3.2, center: '04', zoom: 1.6, dur: 1.8 }],
    portal: { dir: 'in', slot: '04', at: 6.2, dur: 1.8 },
  }, { transition: { in: 'fade', out: 'cut' } }),

  // L19 · "That's why the staff saw nothing..."  comes back out of slot 04 as the card lands
  board('l19-proxy', 'L19 · BOARD · Proxy switch · threads, mute, legend', 11, {
    line: 'L19', cues: { '04': 1.5, 'proxy-atm': 2.8, 'proxy-core': 3.8, 'proxy-core:mute': 5.6 },
    camera: [{ t: 0, center: ['03', '04', '02'] }, { t: 2.4, center: ['04', '02', '01'], dur: 2.2 }],
    portal: { dir: 'out', slot: '04', at: 0, dur: 1.6 },
    legend: { at: 6.6 },
  }, { transition: { in: 'cut', out: 'fade' } }),

  // L28 · "Remember that name: Big Boss. He's the loose thread in this story."
  board('l28-big-boss', 'L28 · BOARD · Big Boss · the loose thread', 8, {
    line: 'L28', cues: { '05': 0.6, '06': 2.0, 'bb-loose': 3.2 },
    camera: [{ t: 0, center: 'col:fix' }, { t: 2.6, center: '06', zoom: 1.7, dur: 2.2 }],
    focus: [{ at: 3.6, dur: 4, ids: ['06'] }],
  }),

  // L46 · "The next day, Visa sent Cosmos the full list..."  recap glide, the cash column, the ledger
  board('l46-exit-phase3', 'L46 · BOARD · Exit phase 3 · recap, cash, ledger', 13, {
    line: 'L46',
    cues: { '09': 5.0, '10': 5.6, 'proxy-visa': 6.3, 'proxy-rupay': 6.7, 'bb-crews': 7.3, visa: 8.0, rupay: 8.6 },
    camera: [
      { t: 0, center: 'all' },
      ...CASE.glide(['04', '01', '08', '07', '06'], 0.3, 0.75),
      { t: 4.4, center: 'col:cash', dur: 1.4 },
      { t: 9.6, center: 'all', dur: 1.6 },
      { t: 11.2, center: '11', zoom: 1.4, dur: 1.6, ease: 'inOutSine' },
    ],
  }),

  // L64 · "...He used the same email address for all of them."
  board('l64-aliases', 'L64 · BOARD · Alias fan-out', 9, {
    line: 'L64', cues: { '06.fan': 1.0 },
    camera: [{ t: 0, center: '06', zoom: 1.25 }, { t: 0.4, center: '06', zoom: 1.05, dur: 3 }],
    focus: [{ at: 0.6, dur: 7.6, ids: ['06'] }],
  }),

  // L68 · "Ordered to repay, that is..."  aliases collapse, the card flips, stamp, struck clip
  board('l68-alaumary', 'L68 · BOARD · Flip · stamp · struck clip', 12, {
    line: 'L68',
    cues: { '06.fan:out': 0.4, '06.flip': 2.0, '06.stamp1': 3.4, '06.clip1': 5.0, '06.clip1:strike': 7.4, '06.clip2': 8.4 },
    camera: [{ t: 0, center: '06', zoom: 1.05 }, { t: 1.4, center: '06', zoom: 1.75, dur: 2.2 }],
    focus: [{ at: 0, dur: 11.5, ids: ['06'] }],
  }),

  // L71 · "...may have helped pay for it."  the last slot fills; light travels the chain
  board('l71-keyboard', 'L71 · BOARD · The last slot · pulse along the chain', 13, {
    line: 'L71', cues: { '12': 1.2, '12.stamp1': 2.7, 'hackers-phish': 3.6, nk: 4.6, 'hackers-nk': 5.2 },
    camera: [{ t: 0, center: 'col:key', zoom: 0.95 }, { t: 6.4, center: 'all', dur: 2 }],
    pulses: [{ at: 8.6, path: ['01', '08', '07', '06', '12', 'nk'], hop: 0.5 }],
  }),

  // L76 · "So, eleven mules convicted in Pune... Never arrested."
  board('l76-full-board', 'L76 · BOARD · The full board', 15, {
    line: 'L76', cues: { '08.stamp2': 1.8, open: 11.4 },
    camera: [
      { t: 0, center: 'all' },
      { t: 0.6, center: '08', zoom: 1.6, dur: 1.4 },
      { t: 3.4, center: '06', zoom: 1.6, dur: 1.4 },
      { t: 5.6, center: '07', zoom: 1.6, dur: 1.4 },
      { t: 7.8, center: 'all', dur: 2.2 },
    ],
    glows: [{ at: 3.8, ids: ['06'], dur: 1.6 }, { at: 6.0, ids: ['07'], dur: 1.6 }],
    focus: [{ at: 10.6, dur: 4.2, ids: ['12'] }],
  }),

  // L78 · "The men at the ATMs were told..."  one last glide, then into the Kolhapur ATM card
  board('l78-dive-atm', 'L78 · BOARD · Dive into card 01', 8, {
    line: 'L78',
    camera: [{ t: 0, center: 'all' }, ...CASE.glide(['12', '06', '08', '01'], 0.4, 0.9, { zoom: 1.3 })],
    portal: { dir: 'in', slot: '01', at: 5.0, dur: 2.2 },
  }, { transition: { in: 'fade', out: 'cut' } }),
];

// L79 · "So what do you think?..."  the same board on the narrator's wall
(function wallScene() {
  const K = 4.2, F = 1010;
  const wall = new UF.CaseFileWall({ file: CASE, line: 'L79', x: 640, y: 430, w: 900, cues: { 'q-small': 3.0, 'q-none': 4.0 } });
  const fig = new UF.Character({
    role: 'main', x: 1300, y: F, scale: K, facing: -1, start: 'stand', seed: 3,
    actions: [
      { at: 0.8, pose: 'point', target: wall.point('12') },
      { at: 2.8, pose: 'reach', target: wall.point('q-small') },
      { at: 5.4, view: 'front', pose: 'talk' },
    ],
  });
  const layers = [
    new UF.Room({ floor: F, wall: '#171b22', ground: '#0d0f13', dim: 0.15 }),
    wall,
    fig,
    new UF.Light({ type: 'pool', x: 640, y: 420, r: 720, ry: 420, color: '#cfdcf0', alpha: 0.05 }),
    new UF.Light({ type: 'vignette', x: 960, y: 560, r: 1100, color: '#000000', alpha: 0.55 }),
  ];
  scenes.push({
    id: 'l79-wall', title: 'L79 · NARRATOR · The board on the wall', duration: 9, pushIn: 0,
    layers: [
      new UF.Camera({ layers, x: 960, y: 560, zoom: 1.02, handheld: 0.5, moves: [{ at: 0, dur: 9, zoom: 1.1 }] }),
      new UF.DramaLabel({ text: 'ILLUSTRATION', at: 0.2, plate: true }),
    ],
  });
})();

new UF.Stage({ title: 'EP02 · CASE FILE PROTOTYPE', slug: 'ep02-board', gap: 1.0, scenes });
</script>
</body>
</html>
