<title>EP01 — Bangladesh Bank Heist — ME replacements</title>
<!--
  Unfiction · EP01 · the 27 ME beats, rebuilt faceless. Four treatments:
    NARRATOR  the channel's narrator figure in one recurring room with an evidence wall
    TEXT      the line itself, set large and landing with the voice (UF.BigText)
    BOARD     a full-screen evidence board
    KEY       big text with no background: open with ?key and SHIFT+E to export on green,
              then key it over the shot named in the scene title (anim-scenes.html / gfx-scenes.html)

  SPACE play/pause · ←/→ previous/next · 1-9 jump · E export · SHIFT+E export all · K editorial check
  To retime a beat to your voice-over, change the numbers in its scene only.
-->
<script src="../../toolkit/core/uf-core.js"></script>
<script src="../../toolkit/core/uf-draw.js"></script>
<script src="../../toolkit/components/uf-overlays.js"></script>
<script src="../../toolkit/components/uf-board.js"></script>
<script src="../../toolkit/components/uf-bigtext.js"></script>
<script src="../../toolkit/components/uf-props.js"></script>
<script src="../../toolkit/components/uf-character.js"></script>
<script src="../../toolkit/components/uf-sets.js"></script>
</head>

<script>
'use strict';

const D = UF.draw;
const { c, seg, ease } = UF;
const W = UF.W, H = UF.H;
const prop = (type, o) => new UF.Prop(Object.assign({ type }, o));

/* ==================================================================== */
/* The narrator room                                                    */
/* ==================================================================== */
const K = 4.2;     // px per cm in the room
const F = 1010;    // floor line

/**
 * A small cork board on the room's wall. Cards are placed relative to the board centre.
 * card: { id, x, y, text, sub, at, w, h, color: 'paper' | 'red', angle, flip: { at, text, sub } }
 */
class WallBoard extends UF.Component {
  constructor(o) { super({ x: 520, y: 400, w: 600, h: 380, cards: [], strings: [] }, o); }

  point(id) {
    const cd = this.cards.find(k => k.id === id);
    if (!cd) throw new Error(`WallBoard: no card "${id}".`);
    return [this.x + cd.x, this.y + cd.y];
  }

  draw(ctx, t) {
    const a = this.vis(t);
    if (a <= 0) return;
    const { x, y, w, h } = this;
    ctx.save();
    ctx.globalAlpha = a;
    D.roundRect(ctx, x - w / 2 - 12, y - h / 2 - 12, w + 24, h + 24, 6);
    ctx.fillStyle = '#2a2119'; ctx.fill();
    const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    g.addColorStop(0, '#6e5434'); g.addColorStop(1, '#4f3c26');
    ctx.fillStyle = g; ctx.fillRect(x - w / 2, y - h / 2, w, h);

    for (const s of this.strings) {
      const p = ease.inOutCubic(seg(t, s.at, 0.7));
      if (p <= 0) continue;
      const [x0, y0] = this.point(s.from), [x1, y1] = this.point(s.to);
      ctx.strokeStyle = c('red'); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x0, y0 - 40); ctx.lineTo(x0 + (x1 - x0) * p, y0 - 40 + (y1 - y0) * p); ctx.stroke();
    }

    for (const cd of this.cards) {
      if (t < cd.at) continue;
      const p = ease.outBack(seg(t, cd.at, 0.45));
      const u = cd.flip ? seg(t, cd.flip.at, 0.5) : 0;
      const face = cd.flip && u >= 0.5 ? cd.flip : cd;
      const cw = cd.w || 190, ch = cd.h || 120;
      ctx.save();
      ctx.translate(x + cd.x, y + cd.y);
      ctx.rotate((cd.angle ?? 0) * Math.PI / 180);
      ctx.scale(p * Math.max(0.02, Math.abs(Math.cos(Math.PI * u))), p);
      const red = (face.color || cd.color) === 'red';
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-cw / 2 + 5, -ch / 2 + 7, cw, ch);
      ctx.fillStyle = red ? '#b3262c' : '#e9e3d6'; ctx.fillRect(-cw / 2, -ch / 2, cw, ch);
      ctx.fillStyle = red ? '#f2e9dc' : '#b3262c';
      ctx.beginPath(); ctx.arc(0, -ch / 2 + 12, 6, 0, Math.PI * 2); ctx.fill();
      const lines = face.text.split('\n');
      ctx.font = UF.font.sans(lines.length > 1 ? 24 : 28, 'bold');
      lines.forEach((ln, i) => D.text(ctx, ln, 0, (i - (lines.length - 1) / 2) * 30 + (face.sub ? -6 : 8),
        { color: red ? '#fff6ea' : '#1d1b18', align: 'center', baseline: 'middle' }));
      if (face.sub) {
        ctx.font = UF.font.mono(14, 'bold');
        D.text(ctx, face.sub, 0, ch / 2 - 18, { color: red ? 'rgba(255,246,234,.8)' : 'rgba(29,27,24,.6)', align: 'center', baseline: 'middle', spacing: 2 });
      }
      ctx.restore();
    }
    ctx.restore();
  }

  editorial() { return {}; }
}

/**
 * One narrator beat in the room.
 * o.cards / o.strings  the wall board
 * o.fig                Character options, or ({ board, chair, monitor }) => options
 * o.seated             start in the chair at the desk instead of standing by the board
 * o.monitor            extra options for the desk monitor
 * o.moves              Camera moves; o.over: layers drawn on top, outside the camera
 */
function narratorScene(id, title, end, o) {
  const P = (type, p) => prop(type, Object.assign({ scale: K }, p));
  const desk = P('desk', { x: 1340, y: F, length: 130 });
  const top = desk.point('top')[1];
  const chair = P('chair', { x: 1010, y: F });
  const monitor = P('monitor', Object.assign({ x: 1420, y: top, content: 'dashboard', glow: true }, o.monitor));
  const board = new WallBoard({ cards: o.cards || [], strings: o.strings || [] });
  const f = typeof o.fig === 'function' ? o.fig({ board, chair, monitor }) : (o.fig || {});
  const fig = new UF.Character(Object.assign({
    role: 'main', x: o.seated ? chair.point('seat')[0] : 900, y: F, scale: K,
    facing: o.seated ? 1 : -1, start: o.seated ? 'sitLean' : 'stand', seed: 3,
  }, f));
  const layers = [
    new UF.Room({ floor: F, wall: '#1a1e26', ground: '#0e1014', dim: 0.15 }),
    P('window', { x: 1700, y: 330, w: 80, h: 90, mode: 'night', blinds: 0.7 }),
    board,
    desk,
    monitor,
    P('lamp', { x: 1590, y: top, on: true }),
    P('mug', { x: 1520, y: top }),
    chair,
    fig,
    new UF.Light({ type: 'pool', x: 520, y: 420, r: 520, ry: 360, color: '#ffd9a0', alpha: 0.06 }),
    new UF.Light({ type: 'pool', x: 1480, y: 760, r: 520, ry: 300, color: '#ffd59a', alpha: 0.07 }),
    new UF.Light({ type: 'vignette', x: 960, y: 560, r: 1100, color: '#000000', alpha: 0.55 }),
  ];
  return {
    id, title, duration: end, pushIn: 0,
    layers: [
      new UF.Camera({ layers, x: 960, y: 580, zoom: 1.04, handheld: 0.6, moves: o.moves || [{ at: 0, dur: end, zoom: 1.12 }] }),
      ...(o.over || []),
      new UF.DramaLabel({ text: 'ILLUSTRATION', at: 0.2, plate: true }),
    ],
  };
}

/** Big text on black (o.bg !== false) or keyed over another shot. */
function textScene(id, title, end, text, o = {}) {
  return {
    id, title, duration: end, pushIn: o.bg === false ? 0 : 0.02,
    transition: o.transition,
    layers: [
      ...(o.bg === false ? [] : [new UF.Background({ style: 'void', dust: false })]),
      new UF.BigText(text),
      ...(o.source ? [new UF.SourceTag({ text: o.source, at: o.sourceAt ?? 1, x: W / 2, align: 'center', y: H - 64 })] : []),
    ],
  };
}

/** A full-screen evidence board. */
function boardScene(id, title, end, board, source) {
  return {
    id, title, duration: end, pushIn: 0,
    layers: [
      new UF.EvidenceBoard(Object.assign({ surface: 'cork', light: true, seed: 9 }, board)),
      new UF.SourceTag(source ? { text: source, at: 1 } : { text: 'Summary of the story so far', label: 'NOTE', at: 1 }),
    ],
  };
}

/* ==================================================================== */
/* Cold open – Act 2                                                    */
/* ==================================================================== */
const scenes = [

  textScene('l03-one-word', 'L03 · TEXT · One word', 11, {
    kicker: 'AND MOST OF IT WAS STOPPED', kickerAt: 0.3, dimPrev: true,

      { id: 'swift', kind: 'doc', x: 1450, y: 400, at: 1.6, title: 'SWIFT TERMINAL', sub: 'BANGLADESH BANK' },

  // L29 · "Four strangers. Same title, same salary, fake IDs, empty accounts... that branch manager"
  boardScene('l29-four-strangers', 'L29 · BOARD · Four strangers', 13, {

  // L32 · "Now, the routes were ready. But a billion-dollar transfer gets noticed... They needed time."
  textScene('l32-needed-time', 'L32 · TEXT · They needed time', 16, {
    dimPrev: true,
    lines: [
      { text: 'THE ROUTES WERE READY.', at: 0.4, size: 90 },

      { id: 'q', kind: 'note', x: 1260, y: 470, at: 2.2, title: 'LATER', text: 'What happened to her?', mark: { at: 3.6, color: 'red' } },

  // L89 · "Which brings us to the question everyone was asking. Who was actually behind the keyboard?"
  (() => {
    const P = (type, p) => prop(type, Object.assign({ scale: K }, p));
    const desk = P('desk', { x: 1080, y: F, length: 110 });
    const top = desk.point('top')[1];
    const chair = P('chair', { x: 800, y: F });
    const layers = [
      new UF.Room({ floor: F, wall: '#0d1015', ground: '#07080a', dim: 0.4 }),
      desk,
      P('monitor', { x: 1150, y: top, content: 'code', glow: true }),
      chair,
