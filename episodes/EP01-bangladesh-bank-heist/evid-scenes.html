<!--

  Highlight rects are in screenshot pixels (measured on the PNG); pageRects() scales them to the page.

  photos/L92.png is the two-byte patch (an optional insert for L43–44);
  photos/l92-swift-code.png is the L92 shot itself (BBHOBDDH in the malware).

  SPACE play/pause · ←/→ previous/next · 1-9 jump · E export · SHIFT+E export all · K editorial check
-->
<script src="../../toolkit/core/uf-core.js"></script>
<script src="images.js"></script>
<script src="../../toolkit/core/uf-draw.js"></script>

</head>
<body>
<script>
'use strict';

/** Size of each original screenshot (photos-src/), the space every rect below is measured in. */
const SRC = { l42: [1704, 887], l92: [1356, 899], l79: [1745, 758], 'l95-headline': [1815, 858], l95: [1895, 940],
  'l96-fbi-wanted': [1275, 1369], l104: [1754, 922], 'l92-swift-code': [1024, 517] };

/**
 * A DocumentReveal of a screenshot; every `rect` in its effects is given in screenshot pixels.
 * `h` is passed explicitly: before the image decodes the page assumes A4, and camera targets would aim too high.
 */
function shot(image, w, o) {
  const [sw, sh] = SRC[image], s = w / sw;
  const scale = list => (list || []).map(e => (e.rect ? Object.assign({}, e, { rect: e.rect.map(v => Math.round(v * s)) }) : e));
  return new UF.DocumentReveal(Object.assign({ image, w, h: Math.round(sh * s), x: 960, y: 540, angle: -0.4 }, o, {
    highlights: scale(o.highlights), marks: scale(o.marks), camera: scale(o.camera),
  }));
}

const desk = () => new UF.Background({ style: 'desk', glow: 'rgba(217,164,65,.05)' });
const source = (text, at) => new UF.SourceTag({ text, at, x: UF.W / 2, align: 'center', y: UF.H - 64 });

/* ==================================================================== */
/* L42 · "Two bytes to $951m"                                           */
/* ==================================================================== */
function sceneBaeReport() {
  const B = {
    page: 0.2,    // L42  "Two months after the heist, investigators at BAE Systems published an analysis..."
    byline: 1.4,  //      author and date
    title: 5.2,   // L42  "They called their report 'Two bytes to $951m.'"
    end: 9,
  };
  return {
    id: 'l42-bae-report',
    title: 'L42 · BAE Systems, "Two bytes to $951m"',
    duration: B.end,
    pushIn: 0,
    layers: [
      desk(),
      shot('l42', 1500, {
        at: B.page,
        highlights: [{ rect: [252, 68, 1160, 52], at: B.byline, dur: 0.8 }],
        marks: [{ rect: [244, 186, 632, 90], at: B.title, dur: 0.7, color: 'red' }],
        camera: [
          { t: 0, center: [960, 540], zoom: 1 },
          { t: B.byline - 0.4, rect: [255, 71, 1153, 45], zoom: 1.45, dur: 1.4, ease: 'inOutCubic' },
          { t: B.title - 0.5, rect: [252, 194, 614, 74], zoom: 1.7, dur: 1.4, ease: 'inOutCubic' },
        ],
      }),
      source('BAE Systems Threat Research blog, 25 April 2016', 0.9),
    ],
  };
}

/* ==================================================================== */
/* L43–44 insert · the patch itself, from the same BAE post             */

    id: 'l44-bae-patch',
    title: 'L43–44 insert · The two bytes, BAE Systems',

    pushIn: 0,
    layers: [
      desk(),
      shot('l92', 1180, {
        at: B.page, angle: 0.3,
        marks: [
          { rect: [66, 162, 1200, 40], at: B.jump, dur: 0.7, color: 'red' },
          { rect: [66, 528, 1200, 72], at: B.nops, dur: 0.8, color: 'red' },

        camera: [
          { t: 0, center: [960, 540], zoom: 1 },
          { t: B.jump - 0.4, rect: [71, 116, 1190, 250], zoom: 1.45, dur: 1.4, ease: 'inOutCubic' },
          { t: B.nops - 0.5, rect: [71, 483, 1190, 290], zoom: 1.45, dur: 1.4, ease: 'inOutCubic' },
        ],
      }),
      source('BAE Systems Threat Research blog, 25 April 2016', 0.9),
    ],
  };
}

new UF.Stage({
  title: 'EP01 · EVIDENCE',
