/* ==================================================================== */
/* L07 · Flash cuts: a street sign, a typo, casinos, a wanted poster    */
/* ==================================================================== */
const CHIPS = { red: ['#c0262f', '#7c161c'], black: ['#2a2d32', '#111215'], amber: ['#d29a34', '#8e6420'], white: ['#ebe6da', '#a8a295'] };

/** (x, y) is the centre of the bottom chip's lower face; only the top chip shows its face. */
function chipStack(ctx, x, y, n, [face, side], rx = 74) {
  const ry = rx * 0.34, hh = 14;
  const mark = face === CHIPS.white[0] ? 'rgba(170,32,40,.9)' : 'rgba(255,255,255,.72)';
  const shade = ctx.createLinearGradient(x - rx, 0, x + rx, 0);
  shade.addColorStop(0, 'rgba(0,0,0,.45)');
  shade.addColorStop(0.35, 'rgba(0,0,0,0)');
  shade.addColorStop(0.75, 'rgba(0,0,0,.1)');
  shade.addColorStop(1, 'rgba(0,0,0,.5)');
  const band = cy => {
    ctx.beginPath();
    ctx.ellipse(x, cy, rx, ry, 0, 0, Math.PI);
    ctx.lineTo(x - rx, cy - hh);
    ctx.ellipse(x, cy - hh, rx, ry, 0, Math.PI, 0, true);
    ctx.closePath();
  };
  for (let i = 0; i < n; i++) {
    const cy = y - i * hh;
    band(cy);
    ctx.fillStyle = side;
    ctx.fill();
    ctx.fillStyle = mark;
    const turn = (i * 0.83) % 1.1;
    for (let k = 0; k < 5; k++) {
      const a0 = 0.25 + turn * 0.5 + k * 0.62, a1 = a0 + 0.17;
      if (a1 > Math.PI - 0.08) continue;
      ctx.beginPath();
      ctx.moveTo(x + rx * Math.cos(a0), cy - hh + ry * Math.sin(a0) + 3);
      ctx.lineTo(x + rx * Math.cos(a1), cy - hh + ry * Math.sin(a1) + 3);
      ctx.lineTo(x + rx * Math.cos(a1), cy + ry * Math.sin(a1) - 3);
      ctx.lineTo(x + rx * Math.cos(a0), cy + ry * Math.sin(a0) - 3);
      ctx.closePath();
      ctx.fill();
    }
    band(cy);
    ctx.fillStyle = shade;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(x, cy - hh, rx, ry, 0, 0, Math.PI);
    ctx.stroke();
  }
  const ty = y - n * hh;
  ctx.fillStyle = face;
  ctx.beginPath();
  ctx.ellipse(x, ty, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.22)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.strokeStyle = mark;
  ctx.lineWidth = 3;
  ctx.setLineDash([10, 9]);
  ctx.beginPath();
  ctx.ellipse(x, ty, rx * 0.84, ry * 0.84, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(x, ty, rx * 0.52, ry * 0.52, 0, 0, Math.PI * 2);
  ctx.stroke();
}

let wantedSprite = null;
function wantedPoster() {
  if (wantedSprite) return wantedSprite;
  const w = 560, h = 760, raw = UF.canvas(w, h), x = raw.getContext('2d');
  x.drawImage(D.paperTexture(w, h, 41), 0, 0);
  x.strokeStyle = UF.c('red');
  x.lineWidth = 10;
  x.strokeRect(14, 14, w - 28, h - 28);
  x.font = UF.font.display(132);
  D.text(x, 'WANTED', w / 2, 170, { color: UF.c('red'), spacing: 6, align: 'center' });
  x.font = UF.font.mono(30, 'bold');
  D.text(x, 'BY THE FBI', w / 2, 222, { color: '#1d1b18', spacing: 10, align: 'center' });
  x.fillStyle = '#a19d93';
  x.fillRect(110, 262, 340, 330);
  D.icon(x, 'user', w / 2, 440, 250, { color: '#4a4740', width: 4 });
  x.fillStyle = 'rgba(29,27,24,.55)';
  for (const [lw, ly] of [[380, 632], [300, 666], [340, 700]]) x.fillRect((w - lw) / 2, ly, lw, 12);
  const out = UF.canvas(w + 40, h + 40), o = out.getContext('2d');
  o.filter = 'blur(5px)';
  o.drawImage(raw, 20, 20);
  return (wantedSprite = out);
}

function sceneFlashCuts() {
  const B = {
    sign: 0.2,    // L07  "A street sign."
    typo: 1.3,    //      "A spelling mistake."
    chips: 2.5,   //      "Casinos."
    wanted: 3.4,  //      "And a hacker the FBI says works for one of the most secretive countries on Earth."
    hold: 0.55,   //      each flash stays up this long; the last one holds to the end
    end: 8,
  };
  const spot = (ctx, x, y, r, color) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, UF.W, UF.H);
  };
  const stacks = [[700, 690, 7, CHIPS.red], [1220, 680, 9, CHIPS.black], [960, 750, 12, CHIPS.amber], [1460, 770, 5, CHIPS.white],
    [560, 800, 4, CHIPS.black], [830, 850, 3, CHIPS.red], [1130, 860, 6, CHIPS.red]];
  const shots = [
    [B.sign, ctx => {
      spot(ctx, 960, 470, 760, 'rgba(58,110,165,.24)');
      D.sign(ctx, 'JUPITER ST', 960, 450, { size: 130, angle: -3, pole: 700 });
    }],
    [B.typo, (ctx, lt) => {
      spot(ctx, 960, 540, 820, 'rgba(217,164,65,.14)');
      ctx.translate(960, 540);
      ctx.rotate(-0.035);
      ctx.drawImage(D.paperTexture(1240, 300, 23), -620, -150);
      ctx.font = UF.font.type(96, 'bold');
      const a = 'SHALIKA ', b = 'FUNDATION', wa = D.measure(ctx, a), wb = D.measure(ctx, b), x0 = -(wa + wb) / 2;
      D.text(ctx, a + b, x0, 34, { color: '#1d1b18' });
      D.circleMark(ctx, x0 + wa + wb / 2, 0, wb / 2 + 40, 86, UF.ease.outCubic(UF.clamp(lt / 0.35)), { color: UF.c('red'), width: 9, seed: 4 });
    }],
    [B.chips, ctx => {
      spot(ctx, 960, 680, 760, 'rgba(193,18,31,.2)');
      for (const [x, y, n, col] of stacks) chipStack(ctx, x, y, n, col);
    }],
    [B.wanted, ctx => {
      spot(ctx, 960, 540, 720, 'rgba(193,18,31,.28)');
      const img = wantedPoster();
      ctx.drawImage(img, 960 - img.width / 2, 540 - img.height / 2);
    }],
  ];
  return {
    id: 'flash-cuts',
    title: 'L07 · Flash cuts',
    duration: B.end,
    transition: { in: 'cut', out: 'glitch' },
    pushIn: 0,
    layers: [
      new UF.Background({ style: 'void', dust: false }),
      UF.layer((ctx, t, fx) => {
        shots.forEach(([at, drawShot], i) => {
          const last = i === shots.length - 1, lt = t - at;
          if (lt < 0 || (!last && lt >= B.hold)) return;
          fx.kick(t, at, { glitch: 0.7, glitchDur: 0.08, rgb: 0.9, flash: 0.25, decay: 12 });
          const s = last ? 1 + 0.05 * UF.ease.inOutSine(UF.clamp(lt / (B.end - at))) : 1.08 - 0.08 * UF.ease.outCubic(UF.clamp(lt / B.hold));
          ctx.save();
          ctx.translate(UF.W / 2, UF.H / 2);
          ctx.scale(s, s);
          ctx.translate(-UF.W / 2, -UF.H / 2);
          drawShot(ctx, lt);
          ctx.restore();
        });
      }),
      new UF.DramaLabel({ text: 'ILLUSTRATION', corner: 'br' }),
    ],
  };
}

function sceneRollBack() {
  const B = {
    card: 0.2,      // L16  "And that's exactly where this story really begins."
    flip: 1.4,      //      "Not in 2016..." — thirteen months fly back
    flipDur: 1.8,
    caption: 3.4,   //      "...but more than a year earlier."
    inbox: 4.6,     //      an email arrives (leads into L17)
    end: 7.5,
  };
  return {
    id: 'roll-back',
    title: 'L16 · Back to January 2015',
    duration: B.end,
    layers: [
      new UF.Background({ style: 'void', dust: true }),
      new UF.CalendarFlip({
        from: 'FEB 2016', to: 'JAN 2015', at: B.card, flipAt: B.flip, flipDur: B.flipDur,
        kicker: 'THE STORY STARTS', caption: 'MORE THAN A YEAR BEFORE THE HEIST', captionAt: B.caption, y: 500,
      }),
      UF.layer((ctx, t) => {
        const k = UF.ease.outCubic(UF.seg(t, B.inbox, 0.5));
        if (k <= 0) return;
        ctx.save();
        ctx.globalAlpha = k;
        const x = UF.W - 96 + (1 - k) * 60, y = 960;
        const w = D.pill(ctx, '1 NEW MESSAGE', x, y, { align: 'right', fill: UF.c('black', 0.85), stroke: UF.c('blue'), font: UF.font.mono(20, 'bold'), h: 52, padX: 22 });
        D.icon(ctx, 'email', x - w - 40, y, 44, { color: UF.c('blue'), width: 5 });
        ctx.restore();
      }),
    ],
  };
}

function walker(ctx, x, y, phase, s, color) {
  const sw = Math.sin(phase) * 0.5;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineWidth = 13;
  ctx.beginPath();
  for (const k of [sw, -sw]) { ctx.moveTo(0, -56); ctx.lineTo(Math.sin(k) * 56, -56 + Math.cos(k) * 56); }
  ctx.stroke();
  D.roundRect(ctx, -15, -114, 30, 64, 12);
  ctx.fill();
  ctx.lineWidth = 10;
  ctx.beginPath();
  for (const k of [-sw, sw]) { ctx.moveTo(0, -104); ctx.lineTo(Math.sin(k) * 46, -104 + Math.cos(k) * 46); }
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, -130, 15, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/** Side-view business jet facing right, (x, y) where the wheels meet the ground. */
function jetSide(ctx, x, y, s, { pitch = 0, gear = 1, door = 0 } = {}) {
  const body = UF.c('paper', 0.94), shade = '#aaa59a', glass = '#14171c';
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(pitch);
  ctx.scale(s, s);
  ctx.translate(0, -42);
  ctx.fillStyle = shade;
  ctx.beginPath();
  ctx.moveTo(-168, -18); ctx.lineTo(-226, -110); ctx.lineTo(-196, -110); ctx.lineTo(-118, -20);
  ctx.closePath();
  ctx.fill();
  D.roundRect(ctx, -258, -118, 86, 9, 4);
  ctx.fill();
  ctx.fillRect(-112, -26, 24, 8);
  D.roundRect(ctx, -158, -50, 96, 28, 14);
  ctx.fill();
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(-232, -8);
  ctx.quadraticCurveTo(-200, -20, -150, -22);
  ctx.lineTo(140, -24);
  ctx.quadraticCurveTo(206, -22, 234, 4);
  ctx.quadraticCurveTo(228, 16, 196, 16);
  ctx.lineTo(-150, 16);
  ctx.quadraticCurveTo(-200, 12, -232, -8);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = UF.c('red');
  ctx.fillRect(-200, 4, 396, 3);
  ctx.fillStyle = glass;
  for (let wx = -70; wx <= 100; wx += 30) { ctx.beginPath(); ctx.ellipse(wx, -6, 6, 8, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.beginPath();
  ctx.moveTo(176, -18); ctx.lineTo(206, -14); ctx.lineTo(212, -4); ctx.lineTo(172, -6);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = glass;
  ctx.lineWidth = 2;
  ctx.strokeRect(124, -20, 26, 34);
  if (door > 0) {
    ctx.save();
    ctx.globalAlpha *= door;
    ctx.fillRect(124, -20, 26, 34);
    ctx.restore();
  }
  ctx.fillStyle = shade;
  ctx.beginPath();
  ctx.moveTo(-50, 10); ctx.lineTo(70, 10); ctx.lineTo(10, 24); ctx.lineTo(-70, 24);
  ctx.closePath();
  ctx.fill();
  if (gear > 0) {
    ctx.strokeStyle = shade;
    ctx.lineWidth = 4;
    ctx.fillStyle = '#3a3f47';
    for (const gx of [-20, 176]) {
      ctx.beginPath(); ctx.moveTo(gx, 16); ctx.lineTo(gx, 16 + 18 * gear); ctx.stroke();
      ctx.beginPath(); ctx.arc(gx, 16 + 18 * gear, 8 * gear, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function scenePrivateJet() {
  const B = {
    node: 0.4,    // L86  "As for Weikang Xu,"
    arrow: 1.2,   //      the money arrow runs on out of his node
    walk: 2.2,    //      "...according to the Philippine Senate inquiry, he's believed to have left on a private jet."
    board: 4.5,   //      up the airstair
    roll: 5.8,    //      the jet rolls and lifts off the right edge
    gone: 7.6,    //      "He has never been found."
    end: 11,
  };
  const G = 820, JX = 1320, JS = 1.9, PS = 0.52, START = 760;
  const doorX = JX + 137 * JS, doorY = G - 28 * JS, footX = doorX - 118;
  const arrow = D.cubicPoints(540, 330, 760, 330, 760, 560, START, 700, 60);
  const jetAt = p => ({
    x: JX + 1300 * UF.ease.inCubic(p),
    y: G - 360 * UF.ease.inQuad(UF.clamp((p - 0.5) / 0.5)),
    pitch: -0.14 * UF.ease.inOutSine(UF.clamp((p - 0.42) / 0.25)),
  });
  return {
    id: 'private-jet',
    title: 'L86 · A private jet',
    duration: B.end,
    layers: [
      new UF.Background({ style: 'grid' }),
      new UF.Heading({ kicker: 'THE JUNKET OPERATOR', x: 96, y: 72, at: 0.2 }),
      new UF.FlowChart({
        nodes: [{ id: 'xu', x: 330, y: 330, w: 420, h: 120, title: 'WEIKANG XU', sub: 'Junket operator', value: 30e6, prefix: '≈ ', icon: 'cash', at: B.node, valueSize: 40 }],
        edges: [],
      }),
      new UF.StatusBadge({ status: 'alleged', note: 'Named in Senate testimony', x: 120, y: 446, at: B.node + 0.8 }),
      UF.layer((ctx, t, fx) => {
        const E = UF.ease, seg = UF.seg;
        ctx.save();
        ctx.fillStyle = UF.c('line');
        ctx.fillRect(600, G, UF.W - 600, 2);
        for (let x = 660; x < UF.W; x += 120) ctx.fillRect(x, G + 40, 60, 4);

        const pa = E.inOutCubic(seg(t, B.arrow, 1.0));
        if (pa > 0) {
          ctx.globalAlpha = 1 - seg(t, B.roll, 0.6);
          ctx.lineCap = 'round';
          ctx.strokeStyle = UF.c('red', 0.22);
          ctx.lineWidth = 12;
          D.partialPath(ctx, arrow, pa);
          ctx.stroke();
          ctx.strokeStyle = UF.c('red');
          ctx.lineWidth = 4;
          const head = D.partialPath(ctx, arrow, pa);
          ctx.stroke();
          if (head) D.arrowHead(ctx, head.x, head.y, head.a, 22, UF.c('red'));
          ctx.globalAlpha = 1;
        }

        const pw = E.inOutSine(seg(t, B.walk, B.board - B.walk)), pc = E.inOutSine(seg(t, B.board, 0.6));
        let px = UF.lerp(START, footX, pw), py = G;
        if (pc > 0) { px = UF.lerp(footX, doorX - 4, pc); py = UF.lerp(G, doorY, pc); }
        const shown = seg(t, B.arrow + 0.8, 0.3) * (1 - seg(t, B.board + 0.6, 0.3));
        if (pw > 0) {
          ctx.globalAlpha = 1 - seg(t, B.roll, 0.6);
          ctx.strokeStyle = UF.c('red', 0.5);
          ctx.lineWidth = 3;
          ctx.setLineDash([10, 12]);
          ctx.beginPath();
          ctx.moveTo(START, G + 14);
          ctx.lineTo(Math.min(px, footX), G + 14);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
        }

        const pr = seg(t, B.roll, B.gone - B.roll), j = jetAt(pr);
        const retract = E.inOutCubic(seg(t, B.board + 1.0, 0.4));
        if (retract < 1) {
          const fx0 = UF.lerp(footX, doorX, retract), fy0 = UF.lerp(G, doorY, retract);
          const dx = doorX - fx0, dy = doorY - fy0;
          ctx.lineCap = 'round';
          ctx.strokeStyle = '#b8b3a7';
          ctx.lineWidth = 5;
          ctx.beginPath();
          for (let k = 1; k <= 5; k++) {
            const sx = fx0 + dx * k / 6, sy = fy0 + dy * k / 6;
            ctx.moveTo(sx - 9, sy - 3);
            ctx.lineTo(sx + 9, sy - 3);
          }
          ctx.stroke();
          ctx.strokeStyle = '#8a857b';
          ctx.lineWidth = 9;
          ctx.beginPath();
          ctx.moveTo(fx0, fy0);
          ctx.lineTo(doorX, doorY);
          ctx.stroke();
          ctx.strokeStyle = '#a19c91';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(fx0 + 4, fy0 - 44);
          ctx.lineTo(doorX - 4, doorY - 44);
          for (const k of [0.1, 0.5, 0.9]) {
            ctx.moveTo(fx0 + dx * k, fy0 + dy * k - 4);
            ctx.lineTo(fx0 + dx * k, fy0 + dy * k - 44);
          }
          ctx.stroke();
        }

        if (pr > 0.5) {
          ctx.globalAlpha = 1 - seg(t, B.gone, 1.2);
          ctx.strokeStyle = UF.c('paper', 0.35);
          ctx.lineWidth = 3;
          ctx.setLineDash([14, 12]);
          ctx.beginPath();
          for (let q = 0.5; q <= pr; q += 0.01) {
            const k = jetAt(q);
            q === 0.5 ? ctx.moveTo(k.x - 200 * JS, k.y - 40 * JS) : ctx.lineTo(k.x - 200 * JS, k.y - 40 * JS);
          }
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
        }
        jetSide(ctx, j.x, j.y, JS, { pitch: j.pitch, gear: 1 - UF.clamp((pr - 0.62) / 0.15), door: 1 - seg(t, B.board + 1.0, 0.3) });
        fx.kick(t, B.roll, { shake: 0.004, decay: 6 });

        if (shown > 0) {
          ctx.globalAlpha = shown;
          walker(ctx, px, py, (px - START) / 26 + pc * 6, PS, UF.c('red'));
          ctx.globalAlpha = 1;
        }

        const pl = seg(t, B.walk + 0.6, 0.4) * (1 - seg(t, B.roll + 0.4, 0.4));
        if (pl > 0) {
          ctx.globalAlpha = pl;
          D.pill(ctx, 'BELIEVED TO HAVE LEFT ON A PRIVATE JET', JX, 440, { align: 'center', fill: UF.c('black', 0.85), stroke: UF.c('amber'), font: UF.font.mono(20, 'bold'), h: 44, spacing: 3 });
          ctx.globalAlpha = 1;
        }

        const pq = seg(t, B.gone, 0.5);
        if (pq > 0) {
          const s = UF.lerp(1.6, 1, E.outBack(pq));
          ctx.globalAlpha = UF.clamp(pq * 2);
          ctx.save();
          ctx.translate(JX, 680);
          ctx.scale(s, s);
          ctx.font = UF.font.display(300);
          D.text(ctx, '?', 0, 100, { color: UF.c('amber'), align: 'center' });
          ctx.restore();
          ctx.globalAlpha = seg(t, B.gone + 0.6, 0.4);
          D.pill(ctx, 'NEVER FOUND', JX, 900, { align: 'center', fill: UF.c('red'), font: UF.font.mono(24, 'bold'), h: 50, spacing: 6 });
          fx.kick(t, B.gone, { flash: 0.15, rgb: 0.5, decay: 9 });
        }
        ctx.restore();
      }),
      new UF.DramaLabel({ text: 'ILLUSTRATION', corner: 'br' }),
      new UF.SourceTag({ text: 'BBC, 2021 · Philippine Senate inquiry', at: B.walk }),
    ],
  };
}
