<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EP01 — Bangladesh Bank Heist — ANIM</title>
<!--
  Unfiction · EP01 · ANIM scenes
  Every ANIM shot from the script, drawn in 2D with the toolkit instead of Blender, in script order,
  separated by black. Every shot carries the Dramatisation label (script: "On-screen disclaimers").
  Lines that run straight on from each other share one scene: L13–14, L50–51, L63–64, L67–68.

  SPACE play/pause · R restart · ←/→ previous/next scene · 1-9 jump · H HUD
  E export (whole reel, or one scene when ?scene=N) · SHIFT+E export every scene as its own file
  S save a PNG still · F fullscreen · C cue sheet · K editorial check

  URL options:  ?scene=3  solo one scene      ?frame=4.5  freeze at a time (scene-local with ?scene)
                ?autoplay ?loop               ?scale=2    render at 3840x2160
                ?clean    leave out the burned-in time chips and name tag (key them from overlays.html instead)

  To retime a scene to your voice-over, change the numbers in its BEATS block only.
-->
<script src="../../toolkit/core/uf-core.js"></script>
<script src="../../toolkit/core/uf-draw.js"></script>
<script src="../../toolkit/components/uf-overlays.js"></script>
<script src="../../toolkit/components/uf-timeline.js"></script>
<script src="../../toolkit/components/uf-props.js"></script>
<script src="../../toolkit/components/uf-character.js"></script>
<script src="../../toolkit/components/uf-sets.js"></script>
</head>
<body>
<script>
'use strict';

const D = UF.draw;
const { seg, ease, lerp } = UF;
const W = UF.W, H = UF.H;
const CLEAN = /[?&]clean\b/.test(location.search);

const drama = () => new UF.DramaLabel({ text: 'DRAMATISATION', at: 0.2, plate: true });
const prop = (type, o) => new UF.Prop(Object.assign({ type, fadeIn: 0 }, o));
const burn = layers => (CLEAN ? [] : layers);
const fill = color => UF.layer(ctx => { ctx.fillStyle = color; ctx.fillRect(-W, -H, W * 3, H * 3); });

/* ==================================================================== */
/* The SWIFT room, 10th floor of Bangladesh Bank: one set, seven shots  */
/* ==================================================================== */
const K = 2.8;   // px per cm in the room
const F = 940;   // floor line

/**
 * The room at night or by day. o: { mode, day, clock, printer, door, pc, monA, monB, chair }, where the
 * last few are option overrides for that prop. Returns the props by name, the back-to-front layer list
 * for a camera, and the room's light (drawn after any figures).
 */
function swiftRoom(o = {}) {
  const night = o.mode === 'night';
  const dim = night ? 0.62 : 0;
  const P = (type, base, over) => prop(type, Object.assign({ scale: K, dim }, base, over));
  const desk = P('desk', { x: 900, y: F, length: 170 });
  const table = P('desk', { style: 'table', x: 1450, y: F, length: 80, height: 76 });
  const top = desk.point('top')[1];
  const p = {
    room: new UF.Room({ floor: F, wall: night ? '#11161d' : '#3b4653', ground: night ? '#0a0b0e' : '#1d2228', dim: night ? 0.3 : 0, fadeIn: 0 }),
    window: P('window', { x: 300, y: 420, w: 150, h: 130, mode: night ? 'night' : 'day', blinds: 0.42, dim: night ? 0.1 : 0 }),
    tubeA: P('fluorescent', { x: 640, y: 34, length: 150, on: !night }),
    tubeB: P('fluorescent', { x: 1360, y: 34, length: 150, on: !night }),
    clock: P('wallClock', { x: 1300, y: 400, size: 1.05, dim: night ? 0.3 : 0 }, o.clock),
    calendar: P('calendar', { x: 1080, y: 410, month: 'FEB', day: o.day || 4, year: 2016, dim: night ? 0.45 : 0 }),
    door: P('door', { x: 1790, y: F, sign: 'AUTHORISED\nSTAFF ONLY' }, o.door),
    table,
    printer: P('printer', { x: 1450, y: table.point('top')[1], dim: night ? 0.35 : 0 }, o.printer),
    desk,
    pc: P('pc', { x: 660, y: F, dim: night ? 0.35 : 0 }, o.pc),
    monA: P('monitor', { x: 845, y: top, content: 'terminal', text: 'SWIFT · MESSAGES', glow: true, dim: 0 }, o.monA),
    monB: P('monitor', { x: 1000, y: top, content: 'dashboard', glow: true, dim: 0 }, o.monB),
    keyboard: P('keyboard', { x: 712, y: top, length: 36 }),
    papers: P('paperStack', { x: 1098, y: top }),
    chair: P('chair', { x: 575, y: F }, o.chair),
  };
  const light = night ? [
    new UF.Light({ type: 'pool', x: 920, y: 650, r: 560, ry: 330, color: '#6f98d8', alpha: 0.17 }),
    new UF.Light({ type: 'pool', x: 920, y: F + 6, r: 620, ry: 80, color: '#6f98d8', alpha: 0.09 }),
    new UF.Light({ type: 'beam', from: [[96, 602], [504, 602]], to: [[250, H + 60], [930, H + 60]], color: '#9db8e8', alpha: 0.045 }),
  ] : [
    new UF.Light({ type: 'pool', x: 300, y: 420, r: 1250, ry: 900, color: '#d8e6ff', alpha: 0.07 }),
    new UF.Light({ type: 'pool', x: 640, y: 70, r: 760, ry: 440, color: '#dfe8ff', alpha: 0.09 }),
    new UF.Light({ type: 'pool', x: 1360, y: 70, r: 760, ry: 440, color: '#dfe8ff', alpha: 0.09 }),
    new UF.Light({ type: 'beam', from: [[96, 602], [504, 602]], to: [[400, H + 60], [1160, H + 60]], color: '#eaf1ff', alpha: 0.07 }),
    new UF.Light({ type: 'pool', x: 1000, y: F + 10, r: 760, ry: 90, color: '#dfe8ff', alpha: 0.07 }),
  ];
  return {
    p, light,
    back: [p.room, p.window, p.tubeA, p.tubeB, p.clock, p.calendar, p.door, p.table, p.printer, p.desk, p.pc,
      p.monA, p.monB, p.keyboard, p.papers, p.chair],
  };
}

/* ==================================================================== */
/* L01 · Thursday night: the empty room                                 */
/* ==================================================================== */
function sceneEmptyRoom() {
  const B = {
    up: 0.2,      // L01  black, then the room: "Thursday night, February 2016. An empty office in Dhaka."
    cursor: 4.2,  // L01  "A cursor starts to move."
    click: 6.2,   //      it clicks, and the terminal starts sending
    orders: 6.6,  // L01  "Over the next few hours, thirty-five orders go out to the New York Federal Reserve."
    end: 15,
  };
  const r = swiftRoom({
    mode: 'night', day: 4, clock: { time: '20:36', run: true },
    monA: {
      rows: { at: B.orders, dur: 8, n: 35 },
      cursor: { path: [[B.cursor, 0.78, 0.72], [B.cursor + 0.9, 0.6, 0.56], [B.cursor + 1.6, 0.42, 0.47], [B.click - 0.1, 0.3, 0.36]], clicks: [B.click], size: 0.18 },
    },
  });
  return {
    id: 'l01-empty-room',
    title: 'L01 · Thursday night, the empty SWIFT room',
    duration: B.end,
    pushIn: 0,
    layers: [
      new UF.Camera({ layers: [...r.back, ...r.light], handheld: 1.2,
        moves: [{ at: 0, dur: B.end, x: 870, y: 600, zoom: 1.55 }] }),
      new UF.Light({ type: 'shade', color: '#000000', alpha: 1, levels: [{ at: B.up, to: 0, dur: 2.2 }] }),
      drama(),
    ],
  };
}

/* ==================================================================== */
/* L04 · Friday morning: the printer has stopped                        */
/* ==================================================================== */
function scenePrinterMorning() {
  const B = {
    door: 2.4,    // L04  "...came from a printer." The door opens
    walk: 2.8,    //      a figure walks in
    look: 4.9,    // L04  "On Friday morning, it stopped working." He looks at the empty tray
    shrug: 7.2,   //      and shrugs
    end: 10,
  };
  const r = swiftRoom({ mode: 'day', day: 5, clock: { time: '10:30', run: true },
    printer: { status: 'error' }, door: { open: { at: B.door, dur: 0.9 } } });
  const officer = new UF.Character({
    role: 'staff', x: 1790, y: F, scale: K, facing: -1, at: B.walk - 0.2, fadeIn: 0.3, seed: 4,
    actions: [
      { at: B.walk, to: 1580, dur: 1.7 },
      { at: B.look, pose: 'lookDown' },
      { at: B.look + 0.7, pose: 'reach', target: r.p.printer.point('tray') },
      { at: B.look + 1.8, pose: 'stand' },

    layers: [
      new UF.Camera({ layers: [...r.back, officer, ...r.light], x: 1250, y: 600, zoom: 1.32, handheld: 1,
        moves: [{ at: 0, dur: B.end, x: 1340, y: 620, zoom: 1.55 }] }),

    ],

}

/* ==================================================================== */
/* L40 · Back to the room: 8:36 pm, the hackers begin                   */
/* ==================================================================== */
function sceneHackersBegin() {
  const B = {
    chip: 1.5,    // L40  "Now let's go back to that room. Thursday, the 4th of February. 8:36 pm in Dhaka."
    begin: 6.8,   // L40  "The office is quiet. And the hackers begin." The cursor moves on its own
    send: 8.2,    //      the first message goes out
    end: 13,
  };
  const r = swiftRoom({
    mode: 'night', day: 4, clock: { time: '20:36', run: true },
    monA: {
      rows: { at: B.send, dur: 40, n: 35 },
      cursor: { path: [[B.begin, 0.76, 0.72], [B.begin + 0.7, 0.58, 0.56], [B.send - 0.1, 0.3, 0.36]], clicks: [B.send], size: 0.18 },
    },
  });
  return {
    id: 'l40-hackers-begin',
    title: 'L40 · 8:36 pm, the hackers begin',
    duration: B.end,
    pushIn: 0,
    layers: [
      new UF.Camera({ layers: [...r.back, ...r.light], x: 1000, y: 560, zoom: 1.18, handheld: 1.2,
        moves: [
          { at: 0, dur: B.begin, x: 960, y: 580, zoom: 1.3 },
          { at: B.begin, dur: 2.6, x: 850, y: 640, zoom: 2.1, ease: 'inOutCubic' },
          { at: B.begin + 2.6, dur: B.end - B.begin - 2.6, zoom: 2.25 },
        ] }),
      ...burn([new UF.TimeChip({ items: [{ at: B.chip, time: '8:36 PM', date: 'THURSDAY 4 FEB', place: 'DHAKA' }] })]),
      drama(),
    ],
  };
}

/* ==================================================================== */
/* L47 · The printer: a page starts to feed, then stops                 */
/* ==================================================================== */
function scenePrinterStalls() {
  const B = {
    feed: 2.0,    // L47  "And it interfered with the printouts." A page starts to feed...
    stall: 2.6,   //      ...and stops halfway out
    quiet: 4.6,   // L47  "...never appeared on the bank's printer." The printer goes quiet
    end: 10,
  };
  const r = swiftRoom({
    mode: 'night', day: 4, clock: { time: '20:36', run: true },
    printer: {
      states: [{ at: B.feed - 0.5, status: 'busy' }, { at: B.quiet, status: 'ready' }],
      whir: [{ at: B.feed - 0.4, dur: B.stall - B.feed + 0.5 }],
      feed: [{ at: B.feed, dur: (B.stall - B.feed) / 0.5, stop: 0.5 }],
    },
  });
  return {
    id: 'l47-printer-stalls',
    title: 'L47 · The printer stalls',
    duration: B.end,
    pushIn: 0,
    layers: [
      new UF.Camera({ layers: [...r.back, ...r.light, new UF.Light({ type: 'pool', x: 1450, y: 660, r: 300, ry: 200, color: '#6f98d8', alpha: 0.06 })],
        x: 1450, y: 670, zoom: 2.5, handheld: 0.8,
        moves: [{ at: 0, dur: B.end, y: 672, zoom: 2.85 }] }),
      drama(),
    ],
  };
}

/* ==================================================================== */
/* L63–64 · Friday 10:30 am: the tray is empty                          */

function sceneFridayMorning() {
  const B = {
    chip: 0.5,    // L63  "Friday morning, the 5th of February. Around half past ten,"
    door: 3.4,    //      the door opens
    walk: 3.8,    //      the duty officer walks in with a folder
    name: 5.0,    // L63  "...the duty officer, Zubair Bin Huda, comes in to collect the overnight SWIFT confirmations."
    look: 8.0,    //      he looks down at the printer
    tray: 10.2,   // L64  "The tray is empty."
    press: 11.8,  // L64  "He tries to print the messages manually."
    fail: 14.6,   // L64  "It doesn't work."
    end: 19,
  };

        moves: [
          { at: 0, dur: B.look - 0.6, zoom: 1.3 },
          { at: B.look - 0.6, dur: 2.4, x: 1420, y: 640, zoom: 1.65, ease: 'inOutCubic' },

        ] }),
      ...burn([
        new UF.TimeChip({ out: B.name + 5.5, items: [{ at: B.chip, time: '10:30 AM', date: 'FRIDAY 5 FEB', place: 'DHAKA' }] }),
        new UF.LowerThird({ name: 'ZUBAIR BIN HUDA', role: 'Duty officer, Bangladesh Bank', status: 'official', at: B.name, out: B.name + 5 }),

/* ==================================================================== */
/* L67–68 · Saturday: frozen, restarted, "A file is missing or changed." */
/* ==================================================================== */
function sceneSaturday() {
  const B = {
    chip: 0.5,      // L67  "Saturday."
    frozen: 1.2,    // L67  "Bin Huda notices the SWIFT software itself isn't responding."
    restart: 4.8,   // L67  "They try to restart it."
    close: 7.4,     // L68  cut to the screen
    error: 8.0,     // L68  "And a message appears on the screen: 'A file is missing or changed.'"
    end: 14,
  };
  const r = swiftRoom({
    mode: 'day', day: 6,
    pc: { restart: B.restart },
    monA: {
      content: 'terminal',
      screens: [{ at: B.frozen, content: 'frozen' }, { at: B.restart, content: 'off' }, { at: B.restart + 1.6, content: 'boot', text: 'RESTARTING' }],
      cursor: { path: [[B.frozen + 0.4, 0.5, 0.52], [B.frozen + 1.2, 0.62, 0.42], [B.frozen + 2.4, 0.6, 0.45]],
        clicks: [B.frozen + 1.3, B.frozen + 1.7, B.frozen + 2.1], out: B.restart, size: 0.18 },
    },
    monB: { screens: [{ at: B.restart, content: 'off' }, { at: B.restart + 1.6, content: 'boot' }] },

  const seat = r.p.chair.point('seat');
  const officer = new UF.Character({
    role: 'staff', x: seat[0], y: F, scale: K, start: 'sitType', seat: 47, seed: 4,
    actions: [
      { at: B.frozen + 0.2, pose: 'sitDesk' },
      { at: B.frozen + 1.6, pose: 'sitThink' },
      { at: B.restart - 0.7, pose: 'sit', target: r.p.pc.point('power') },
      { at: B.restart + 0.6, pose: 'sit' },
      { at: B.restart + 1.4, pose: 'sitDesk' },
    ],
  });
  const screen = prop('monitor', {
    x: 960, y: 540 + 26 * 30, scale: 30,
    screens: [{ at: 0, content: 'boot', text: 'RESTARTING' }, { at: B.error, content: 'error', text: 'A file is missing or changed.' }],
    flickers: [{ at: B.error, dur: 0.06 }],
    cursor: { path: [[B.error + 0.9, 0.84, 0.9], [B.error + 2.2, 0.7, 0.66]], clicks: [B.error + 2.8, B.error + 3.5], size: 0.06 },
  });
  return {
    id: 'l67-saturday',
    title: 'L67–68 · Saturday, "A file is missing or changed."',
    duration: B.end,
    pushIn: 0,
    layers: [
      new UF.Camera({ layers: [...r.back, officer, ...r.light], out: B.close, x: 600, y: 610, zoom: 1.6, handheld: 1,
        moves: [{ at: 0, dur: B.close, x: 640, y: 640, zoom: 1.8 }] }),
      new UF.Camera({ at: B.close, layers: [fill('#06080b'), screen, new UF.Light({ type: 'pool', x: 960, y: 540, r: 1150, ry: 720, color: '#9fc0e8', alpha: 0.05 })],
        handheld: 0.6, moves: [{ at: B.close, dur: B.end - B.close, x: 960, y: 560, zoom: 1.12 }] }),
      ...burn([new UF.TimeChip({ out: B.close, fadeOut: 0, items: [{ at: B.chip, time: '6 FEB', date: 'SATURDAY', place: 'DHAKA' }] })]),
      drama(),

}

/* ==================================================================== */
/* L109 · Back to the printer: one page                                 */
/* ==================================================================== */
function sceneOnePage() {
  const B = {
    whir: 4.0,    // L109 "All of it began with a printer that stopped working on a Friday morning," Then it whirs...
    page: 4.6,    //      ...and a single page slides out
    push: 4.2,    // L109 "...and a man who thought it was a normal glitch." Push in and hold on the page

    layers: [
      new UF.Camera({ layers: [...r.back, ...r.light], x: 1250, y: 600, zoom: 1.32, handheld: 0.8,
        moves: [{ at: B.push, dur: 5.5, x: 1450, y: 650, zoom: 3.0, ease: 'inOutCubic' }] }),
      drama(),
    ],

/* ==================================================================== */
/* Studio: the props-only shots                                         */
/* ==================================================================== */
const S = 4.2;    // px per cm in the studio
const SF = 860;   // studio floor line

/** Dark seamless studio: a wall that falls off into the floor. */
function studio() {
  return UF.layer(ctx => {
    let g = ctx.createLinearGradient(0, -200, 0, SF);
    g.addColorStop(0, '#04060a');
    g.addColorStop(1, '#121826');
    ctx.fillStyle = g;
    ctx.fillRect(-W, -H, W * 3, SF + H);
    g = ctx.createLinearGradient(0, SF, 0, H + 200);
    g.addColorStop(0, '#0e121a');
    g.addColorStop(1, '#030405');
    ctx.fillStyle = g;
    ctx.fillRect(-W, SF, W * 3, H * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.045)';
    ctx.fillRect(-W, SF, W * 3, 1.5);
  });
}

/** A soft overhead spot on x: a faint shaft and a pool on the floor. */
function spot(x, o = {}) {
  const s = o.spread || 260, color = o.color || '#dfe8ff', a = o.alpha ?? 0.05;
  return [
    new UF.Light({ type: 'beam', from: [[x - 60, -80], [x + 60, -80]], to: [[x - s, SF + 40], [x + s, SF + 40]], color, alpha: a, levels: o.levels || [] }),
    new UF.Light({ type: 'pool', x, y: SF + 8, r: s * 1.25, ry: 46, color, alpha: a * 2.4, levels: o.levels || [] }),
  ];
}

/** The desk the licences and the Sri Lanka instruction lie on, under a warm lamp. */
const deskTop = () => [
  new UF.Background({ style: 'desk', glow: 'rgba(217,164,65,.05)' }),
  new UF.Light({ type: 'pool', x: 960, y: 470, r: 900, ry: 560, color: '#ffd9a0', alpha: 0.07 }),
  new UF.Light({ type: 'vignette', x: 960, y: 540, r: 1150, color: '#000000', alpha: 0.55 }),
];

/** The 35 payment instructions laid out 7 by 5, as in L48. */
const GRID = { cols: 7, x0: 330, dx: 150, y0: 330, dy: 96 };
const cell = i => [GRID.x0 + (i % GRID.cols) * GRID.dx, GRID.y0 + Math.floor(i / GRID.cols) * GRID.dy];
const ENV = 1.3;                                   // envelope size in the grid
const num = i => `#${String(i + 1).padStart(2, '0')}`;
const plinthTop = prop('plinth', { x: 0, y: SF, scale: S }).point('top')[1];

/** The New York Fed's vault on its plinth, for the shots where the instructions arrive. */
function nyVault(x, o = {}) {
  const vault = prop('vault', Object.assign({ x, y: plinthTop, scale: S, size: 0.62 }, o));
  return { vault, door: vault.point('door'), layers: [prop('plinth', { x, y: SF, scale: S, label: 'NEW YORK', sub: 'FEDERAL RESERVE BANK' }), vault] };
}

/* ==================================================================== */
/* L13–14 · SWIFT: an ultra-secure letter                               */
/* ==================================================================== */
function sceneSwiftLetter() {
  const B = {
    sets: 0.3,      // L13  "Banks use a system called SWIFT." Dhaka and New York come up
    swift: 1.4,     //      the network between them, labelled SWIFT
    letter: 3.4,    // L13  "Think of it as an ultra-secure letter." An open envelope
    writes: 5.4,    // L13  "A bank writes, 'Pay this amount to this account,'"
    fold: 7.6,      //      the instruction goes into the envelope and the flap closes
    sign: 9.2,      // L13  "...signs it with its digital credentials," the wax seal stamps on
    send: 11.0,     // L13  "...and sends it." The envelope flies to New York
    check: 14.2,    // L14  "If the letter is properly signed," the seal glows green: AUTHENTIC
    trust: 16.2,    // L14  "...the receiving bank trusts it." The vault opens
    money: 18.0,    //      the envelope goes in and money moves out
    billions: 20.6, // L14  "That's the whole point. Billions move every day on that trust."
    end: 26,
  };
  const DX = 380, NX = 1540, E0 = [700, 640];
  const ny = nyVault(NX, { spin: { at: B.trust, dur: 1.1 }, open: { at: B.trust + 0.8, dur: 1.6 } });
  const door = ny.door;
  const A = [[DX, 420], [960, 110], [NX, 360]];
  const arcPt = u => {
    const v = 1 - u;
    return [v * v * A[0][0] + 2 * v * u * A[1][0] + u * u * A[2][0], v * v * A[0][1] + 2 * v * u * A[1][1] + u * u * A[2][1]];
  };
  const network = UF.layer((ctx, t) => {
    const k = ease.inOutCubic(seg(t, B.swift, 1.3));
    if (k <= 0) return;
    ctx.save();
    ctx.lineWidth = 3;
    ctx.strokeStyle = UF.c('blue', 0.6);
    ctx.setLineDash([12, 14]);
    ctx.lineDashOffset = -t * 36;
    ctx.beginPath();
    const n = Math.max(1, Math.round(64 * k));
    for (let i = 0; i <= n; i++) { const p = arcPt(i / 64); if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = UF.c('blue');
    for (const u of [0, 1]) if (u <= k) { const p = arcPt(u); ctx.beginPath(); ctx.arc(p[0], p[1], 6, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  });
  const hover = [NX, ny.vault.point('top')[1] - 85];
  const envO = {
    x: E0[0], y: E0[1], scale: S, size: 2.4, at: B.letter, fadeIn: 0.4, out: B.money + 0.55, fadeOut: 0.12,

    moves: [
      { at: B.send, dur: 2.0, to: hover, arc: 260, ease: 'inOutCubic' },
      { at: B.money, dur: 0.6, to: door, size: 0.6, ease: 'inCubic' },
    ],
  };
  const envBack = prop('envelope', Object.assign({ part: 'back' }, envO));
  const envFront = prop('envelope', Object.assign({ part: 'front' }, envO));
  const paper = prop('message', {
    x: 1040, y: 380, scale: S, size: 5, at: B.writes, fadeIn: 0.5, out: B.fold + 1.0, fadeOut: 0.1,
    fields: [['PAY', 'THIS AMOUNT'], ['TO', 'THIS ACCOUNT']],
    moves: [{ at: B.fold, dur: 0.95, to: [E0[0], E0[1] + 10], size: 0.42, ease: 'inOutCubic' }],
  });
  const cash = [];
  for (let i = 0; i < 14; i++) {

    cash.push(prop('cash', { style: 'bundle', x: door[0], y: door[1] + 12, scale: S, size: 1.4, at, fadeIn: 0.15, out: at + 1.7, fadeOut: 0.2,
      moves: [{ at, dur: 1.9, to: [W + 160, door[1] - 50 + (i % 3) * 34], arc: 40, ease: 'inCubic' }] }));
  }
  const stream = [];
  for (let i = 0; i < 12; i++) {
    const at = B.billions + i * 0.36;
    const from = i % 3 === 0 ? [DX + 70, 560] : [-140, 260 + (i * 97) % 380];
    stream.push(prop('envelope', { x: from[0], y: from[1], scale: S, size: 0.9, at, fadeIn: 0.15, out: at + 1.55, fadeOut: 0.1, sealGlow: at,
      moves: [{ at, dur: 1.6, to: door, size: 0.4, arc: 140 + (i % 4) * 40, ease: 'inOutSine' }] }));
  }
  const cam = new UF.Camera({
    layers: [studio(), ...spot(DX), ...spot(NX), network,
      prop('plinth', { x: DX, y: SF, scale: S, label: 'DHAKA', sub: 'BANGLADESH BANK', at: B.sets, fadeIn: 0.6 }),
      prop('bankModel', { x: DX, y: plinthTop, scale: S, at: B.sets, fadeIn: 0.6 }),
      ...ny.layers, ...cash, ...stream, envBack, paper, envFront],
    handheld: 0.8,
    moves: [
      { at: 0, dur: B.send, x: 860, y: 540, zoom: 1.08 },
      { at: B.send, dur: 2.4, x: 1100, y: 520 },
      { at: B.billions, dur: 5, x: 960, y: 500, zoom: 1.0 },
    ],
  });
  for (const l of ny.layers) { l.at = B.sets + 0.3; l.fadeIn = 0.6; }
  return {
    id: 'l13-swift-letter',
    title: 'L13–14 · SWIFT, an ultra-secure letter',
    duration: B.end,
    pushIn: 0,
    layers: [
      cam,
      new UF.Tag({ text: 'SWIFT', sub: 'MESSAGES BETWEEN BANKS', at: B.swift + 0.9, out: B.letter + 1.6, anchor: arcPt(0.5), camera: cam, dy: -66, color: 'blue', icon: 'globe' }),
      new UF.Tag({ text: 'SWIFT MESSAGE', at: B.sign + 0.5, out: B.check - 0.1, anchor: t => envFront.point('top', t), camera: cam, dy: -72, color: 'blue', icon: 'email' }),

/* L28 · Four licences, all fake                                        */
/* ==================================================================== */
function sceneFakeLicences() {
  const B = {
    first: 0.5,   // L28  "Later it emerged that the driver's licences used to open them..."
    gap: 0.6,     //      the four licences slide in one after another
    stamp: 3.8,   //      "...were fake." The stamp lands on the first
    sgap: 0.6,    //      then on each of the others
    same: 8.6,    // L28  "...all claimed the same job title and the same salary,"
    diff: 11.6,   // L28  "...despite working at different companies."
    end: 17,
  };
  const XS = [330, 750, 1170, 1590], Y = 500, CS = 7.2, ST = 6.5;
  const cards = XS.map((x, i) => {
    const at = B.first + i * B.gap;
    return prop('idCard', { x: W + 220, y: Y - 30, scale: S, size: CS, seed: 11 + i * 7, rotate: 0.22, at, fadeIn: 0.1,
      moves: [{ at, dur: 0.85, to: [x, Y], rotate: [-0.05, 0.03, -0.025, 0.045][i], ease: 'outCubic' }] });
  });
  const hover = i => [XS[i] + 46, Y - 74];
  const moves = [{ at: B.stamp - 1.1, dur: 0.7, to: hover(0), size: ST * 1.35, ease: 'outCubic' }];
  XS.forEach((x, i) => {
    const ts = B.stamp + i * B.sgap;
    if (i) moves.push({ at: ts - 0.42, dur: 0.3, to: hover(i), size: ST * 1.35 });
    moves.push({ at: ts - 0.1, dur: 0.1, to: [x, Y], size: ST, ease: 'inQuad' });
    moves.push({ at: ts + 0.12, dur: 0.22, to: hover(i), size: ST * 1.35, ease: 'outQuad' });
  });
  moves.push({ at: B.stamp + 3 * B.sgap + 0.6, dur: 0.7, to: [W + 260, -220], size: ST * 1.4, ease: 'inCubic' });
  const stamp = prop('rubberStamp', { x: W + 260, y: -220, scale: S, size: ST * 1.4, rotate: 0.08, moves });
  const inks = XS.map((x, i) => new UF.Stamp({ text: 'FAKE', x, y: Y + 6, size: 66, angle: [-12, -8, -15, -10][i], at: B.stamp + i * B.sgap }));
  const bracket = UF.layer((ctx, t) => {
    const k = ease.inOutCubic(seg(t, B.same, 0.8));
    if (k <= 0) return;
    const y = Y + 120, x0 = XS[0] - 120, x1 = XS[3] + 120;
    ctx.save();
    ctx.strokeStyle = UF.c('amber', 0.9);
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x0, y - 18 * k); ctx.lineTo(x0, y); ctx.lineTo(lerp(x0, x1, k), y);
    if (k >= 1) ctx.lineTo(x1, y - 18);
    for (const x of XS) if (lerp(x0, x1, k) >= x) { ctx.moveTo(x, y); ctx.lineTo(x, y - 14); }
    ctx.stroke();
    ctx.restore();
  });
  return {
    id: 'l28-fake-licences',
    title: 'L28 · Four licences, all fake',
    duration: B.end,
    pushIn: 0,
    layers: [
      new UF.Camera({ layers: [...deskTop(), ...cards, ...inks, bracket, stamp], handheld: 0.6,
        moves: [{ at: 0, dur: B.end, x: 960, y: 560, zoom: 1.06 }] }),
      new UF.Tag({ text: 'SAME JOB TITLE · SAME SALARY', at: B.same + 0.5, x: 960, y: 760, color: 'amber', size: 30 }),
      new UF.Tag({ text: 'FOUR DIFFERENT EMPLOYERS', at: B.diff, x: 960, y: 862, color: 'blue', size: 24 }),
      drama(),
    ],
  };
}

    ctx.fillRect(win.x, win.y, 9 * u, win.h);
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = i === 1 ? '#3a6ea5' : '#b9b5ac';
      ctx.fillRect(win.x + u, win.y + (1.4 + i * 1.6) * u, (i === 1 ? 6 : 4 + (i % 3)) * u, 0.55 * u);
    }
    const cx = win.x + 11 * u, top = win.y;
    ctx.fillStyle = '#7a5a8a';
    ctx.beginPath(); ctx.arc(cx + 1.3 * u, top + 2.9 * u, 1.3 * u, 0, Math.PI * 2); ctx.fill();
    ctx.font = UF.font.sans(1.3 * u, '700');
    D.text(ctx, 'R', cx + 1.3 * u, top + 2.95 * u, { color: '#ffffff', align: 'center', baseline: 'middle' });
    ctx.font = UF.font.sans(1.05 * u, '700');
    D.text(ctx, 'Rasel Ahlam', cx + 3.3 * u, top + 2.4 * u, { color: '#1f2328', baseline: 'middle' });
    ctx.font = UF.font.sans(0.75 * u);
    D.text(ctx, 'to Bangladesh Bank staff', cx + 3.3 * u, top + 3.7 * u, { color: '#6a6f76', baseline: 'middle' });
    D.text(ctx, 'January 2015', x + w - 1.6 * u, top + 2.4 * u, { color: '#6a6f76', align: 'right', baseline: 'middle' });
    ctx.font = UF.font.sans(1.55 * u, '700');
    D.text(ctx, 'Job enquiry', cx, top + 6.6 * u, { color: '#1f2328', baseline: 'middle' });
    ctx.font = UF.font.sans(0.95 * u);
    body.forEach((ln, i) => D.text(ctx, ln, cx, top + (9.4 + i * 1.6) * u, { color: '#2a2e35', baseline: 'middle' }));
    const down = t >= B.click && t < B.click + 0.18 ? 1 : 0;
    ui.button(ctx, cx, top + 16.6 * u, 21 * u, 3 * u, 'Download my CV and cover letter', { hot: seg(t, B.hover, 0.3), down, size: 0.95 * u });
    if (t < B.click + 0.15) return;
    const k = ease.outCubic(seg(t, B.click + 0.15, 0.35)), p = seg(t, B.fill, B.done - B.fill);
    const dw = 18 * u, dh = 3.6 * u, dx = x + w - dw - 1.2 * u, dy = y + h - dh - 1.2 * u + (1 - k) * 2 * u;
    ctx.save();
    ctx.globalAlpha *= k;
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fillRect(dx + 0.25 * u, dy + 0.3 * u, dw, dh);
    ctx.fillStyle = '#fbfaf7';
    ctx.fillRect(dx, dy, dw, dh);
    D.icon(ctx, 'doc', dx + 1.6 * u, dy + dh / 2, 2.2 * u, { color: '#3a6ea5', width: 8 });
    ctx.font = UF.font.sans(0.8 * u, '600');
    D.text(ctx, p >= 1 ? 'Download complete' : 'CV and cover letter', dx + 3.2 * u, dy + 1.2 * u, { color: '#1f2328', baseline: 'middle' });
    ui.progress(ctx, dx + 3.2 * u, dy + 2.3 * u, dw - 4.4 * u, 0.55 * u, p, { fill: p >= 1 ? '#2f7d4f' : '#3a6ea5' });
    ctx.restore();
  };
}

/* L83 · Chips across the felt                                          */
/* ==================================================================== */
function sceneChips() {
  const B = {
    push1: 1.0,   // L83  "Why casinos? Because in a casino, money becomes chips," a stack slides in
    push2: 2.2,   //      "...chips become bets," a second
    spill: 4.9,   //      "...and bets become 'winnings'." The top of the first stack spills
    end: 12,      //      "Once that happens, the trail goes cold."
  };
  const KT = 11, FY = 1200;                                                // felt scale at its near edge, near edge
  const persp = y => KT * lerp(1, 96 / 150, (FY - y) / (90 * KT));         // px per cm on the felt at height y
  const chip = (x, y, o) => prop('chips', Object.assign({ x, y, scale: persp(y), tilt: 0.42 }, o));
  const slide = (from, to, at, dur) => ({ at, dur, to, size: persp(to[1]) / persp(from[1]), ease: 'outCubic' });
  const S1 = [[560, 1010], [900, 800]], S2 = [[1420, 1040], [1110, 790]];
  const stacks = [
    chip(1000, 760, { count: 14, color: 'amber' }),
    chip(S2[0][0], S2[0][1], { count: 8, color: 'black', moves: [slide(S2[0], S2[1], B.push2, 3.8)] }),
    chip(S1[0][0], S1[0][1], { count: 6, color: 'red', moves: [slide(S1[0], S1[1], B.push1, 3.6)] }),
  ];
  const spilled = [[-150, 60], [-60, 120], [90, 96], [170, 30]].map(([dx, dy], i) => {
    const lift = (6 + i) * 0.378, at = B.spill + i * 0.07;
    const from = [S1[0][0], S1[0][1] - lift * persp(S1[0][1])], mid = [S1[1][0], S1[1][1] - lift * persp(S1[1][1])];
    const to = [S1[1][0] + dx, S1[1][1] + dy];
    return chip(from[0], from[1], { scale: persp(S1[0][1]), count: 1, color: ['red', 'white', 'red', 'green'][i], moves: [
      { at: B.push1, dur: 3.6, to: mid, size: persp(S1[1][1]) / persp(S1[0][1]), ease: 'outCubic' },
      { at, dur: 1.7, to, size: persp(to[1]) / persp(S1[0][1]), rotate: (i % 2 ? 1 : -1) * 0.5, arc: 26, ease: 'outCubic' },
    ] });
  });
  const pieces = [...stacks, ...spilled];
  return {
    id: 'l83-chips',
    title: 'L83 · Chips across the felt',
    duration: B.end,
    pushIn: 0,
    layers: [
      new UF.Camera({ layers: [
