/* Drawn placeholder portraits, so the wall shows real image tiles without using anyone's photo. */
function portrait(shirt, hair) {
  const cv = document.createElement('canvas');
  cv.width = 480; cv.height = 720;
  const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 720);
  g.addColorStop(0, '#7d8fa3'); g.addColorStop(1, '#3d4652');
  x.fillStyle = g; x.fillRect(0, 0, 480, 720);
  x.fillStyle = shirt; x.beginPath(); x.ellipse(240, 720, 230, 210, 0, Math.PI, 0); x.fill();
  x.fillStyle = '#c99c7f'; x.fillRect(205, 400, 70, 110);
  x.beginPath(); x.ellipse(240, 330, 105, 135, 0, 0, Math.PI * 2); x.fill();
  x.fillStyle = hair; x.beginPath(); x.ellipse(240, 245, 112, 70, 0, Math.PI, 0); x.fill();
  x.fillStyle = '#2a2220'; x.beginPath(); x.arc(200, 330, 9, 0, Math.PI * 2); x.arc(280, 330, 9, 0, Math.PI * 2); x.fill();
  return cv.toDataURL('image/jpeg', 0.9);
}
