<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unfiction GFX Toolkit — Cast and props</title>
<!--
  The recurring character and the props library: turnaround, roles, every pose, walking and
  running, every prop, and three short dramatised set-ups to copy from.
  All of it is illustration; every scene carries a label.
-->
<script src="../core/uf-core.js"></script>
<script src="../core/uf-draw.js"></script>
<script src="../core/uf-geo.js"></script>
<script src="../components/uf-overlays.js"></script>
<script src="../components/uf-props.js"></script>
<script src="../components/uf-character.js"></script>
<script src="../components/uf-presets.js"></script>
</head>
<body>
<script>
'use strict';

const F = 900;

/** Small grey captions under figures: [[x, text], ...]. */
const caption = (items, y) => UF.layer(ctx => {
  ctx.font = UF.font.mono(17, 'bold');
  for (const [x, text] of items) UF.draw.text(ctx, text.toUpperCase(), x, y, { color: UF.c('dim'), align: 'center', spacing: 2 });
});
/** A thin floor line for figures standing on an upper row. */
const shelf = (y, x0 = 60, x1 = 1860) => UF.layer(ctx => {
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(x0, y, x1 - x0, 2);
});
const heading = (kicker, title) => new UF.Heading({ kicker, title, y: 70, size: 40 });
const label = text => new UF.DramaLabel({ text: text || 'ILLUSTRATION' });

/* ------------------------------------------------------------------ */
/* Character                                                           */
/* ------------------------------------------------------------------ */
const turnaround = {
  id: 'turnaround', title: 'Main character — side, front, back', duration: 6,
  layers: [
    new UF.Room({ floor: F }),
    heading('UNFICTION CAST', 'The narrator figure'),
    new UF.Character({ x: 360, y: F, view: 'side' }),
    new UF.Character({ x: 760, y: F, view: 'front' }),
    new UF.Character({ x: 1160, y: F, view: 'back' }),
    new UF.Character({ x: 1560, y: F, view: 'side', facing: -1, start: 'talk' }),
    caption([[360, 'side'], [760, 'front'], [1160, 'back'], [1560, 'side · talk']], F + 70),
    label(),
  ],
};

const closeup = {
  id: 'closeup', title: 'Close-up — detail check at large size', duration: 6,
  layers: [
    new UF.Room({ floor: 1040 }),
    new UF.Character({ x: 600, y: 1040, scale: 4.9, start: 'talk' }),
    new UF.Character({ x: 1320, y: 1040, scale: 4.9, view: 'front', start: 'hips' }),
    label(),
  ],
};

const roles = {
  id: 'roles', title: 'Roles — front and side', duration: 6,
  layers: [
    new UF.Room({ floor: 960 }),
    heading('ROLES', UF.Character.roles.join(' · ')),
    shelf(520),
    ...UF.Character.roles.map((r, i) => new UF.Character({ role: r, view: 'front', x: 165 + i * 227, y: 520, scale: 1.6, seed: i + 1 })),
    caption(UF.Character.roles.map((r, i) => [165 + i * 227, r]), 560),
    ...UF.Character.roles.map((r, i) => new UF.Character({ role: r, view: 'side', x: 150 + i * 227, y: 960, scale: 1.6, seed: i + 3 })),
    label(),
  ],
};

const STAND = ['stand', 'wait', 'reach', 'type', 'handOver', 'receive', 'point', 'pocket', 'lookDown',
               'lookUp', 'phone', 'carry', 'shrug', 'think', 'talk', 'count', 'handsUp'];
const HOLD = { reach: { type: 'card', style: 'blank' }, handOver: 'envelope', phone: 'phone', carry: 'bag', count: { type: 'cash', style: 'fan' } };
const poseAt = i => (i < 9 ? [160 + i * 200, 500] : [260 + (i - 9) * 200, 930]);
const sidePoses = {
  id: 'side-poses', title: 'Side poses (standing)', duration: 6,
  layers: [
    new UF.Room({ floor: 930 }),
    heading('SIDE VIEW', 'Standing poses'),
    shelf(500),
    ...STAND.map((p, i) => new UF.Character({ x: poseAt(i)[0], y: poseAt(i)[1], scale: 1.55, start: p, hold: HOLD[p] || null, seed: i })),
    caption(STAND.map((p, i) => [poseAt(i)[0] + 15, p]).slice(0, 9), 540),
    caption(STAND.map((p, i) => [poseAt(i)[0] + 15, p]).slice(9), 975),
    label(),
  ],
};

const SITS = [
  ['sit', 'office'], ['sitType', 'office', 'desk'], ['sitLaptop', 'plastic', 'laptop'],
  ['sitLean', 'office'], ['sitPhone', 'office'], ['sitThink', 'plastic'],
];
const sitLayers = () => {
  const out = [], k = 2;
  SITS.forEach(([pose, style, extra], i) => {
    const x = 150 + i * 310;
    const chair = new UF.Prop({ type: 'chair', style, x, y: 820, scale: k });
    out.push(chair);
    if (extra) {
      const table = new UF.Prop({ type: 'desk', style: extra === 'desk' ? 'office' : 'table', length: 62, x: x + 125, y: 820, scale: k });
      out.push(table);
      const top = table.point('top');
      if (extra === 'desk') out.push(new UF.Prop({ type: 'keyboard', length: 30, x: top[0] - 30, y: top[1], scale: k }));
      else out.push(new UF.Prop({ type: 'laptop', view: 'side', x: top[0] - 30, y: top[1], scale: k, glow: true }));
    }
    out.push(new UF.Character({ x: chair.point('seat')[0], y: 820, scale: k, start: pose, seat: style === 'plastic' ? 45 : 47,
      hold: pose === 'sitPhone' ? 'phone' : null, seed: i + 2 }));
  });
  out.push(caption(SITS.map(([p], i) => [150 + i * 310 + 40, p]), 870));
  return out;
};
const sitPoses = {
  id: 'sit-poses', title: 'Side poses (seated) with chairs, desk and laptop', duration: 6,
  layers: [new UF.Room({ floor: 820 }), heading('SIDE VIEW', 'Seated poses'), ...sitLayers(), label()],
};

const walk = {
  id: 'walk', title: 'Walk, stop, turn, walk back, face camera · runner behind', duration: 9,
  layers: [
    new UF.Room({ floor: F }),
    heading('MOTION', 'Walk · run · turn'),
    new UF.Character({ role: 'mule', x: 2050, y: 800, scale: 1.9, facing: -1, dim: 0.35, actions: [{ at: 0.6, pose: 'run', to: -150, dur: 2.4 }] }),
    new UF.Character({ x: 160, y: F, actions: [
      { at: 0.4, to: 1000 },
      { at: 3.4, facing: -1 },
      { at: 4.0, to: 640 },
      { at: 5.6, view: 'front', pose: 'wait' },
      { at: 7.0, pose: 'shrug' },
    ] }),
    label(),
  ],
};

const FRONTS = ['stand', 'crossed', 'hips', 'phone', 'think', 'shrug', 'point', 'talk', 'handsUp', 'lookDown'];
const BACKS = [['stand', 'main'], ['reach', 'main'], ['type', 'main'], ['lookDown', 'main'], ['stand', 'mule'], ['stand', 'police'], ['stand', 'civilian'], ['stand', 'hacker']];
const frontBack = {
  id: 'front-back', title: 'Front and back poses', duration: 6,
  layers: [
    new UF.Room({ floor: 950 }),
    heading('FRONT AND BACK', 'Facing the camera · facing away'),
    shelf(510),
    ...FRONTS.map((p, i) => new UF.Character({ view: 'front', x: 140 + i * 182, y: 510, scale: 1.5, start: p, hold: p === 'phone' ? 'phone' : null, seed: i })),
    caption(FRONTS.map((p, i) => [140 + i * 182, p]), 550),
    ...BACKS.map(([p, r], i) => new UF.Character({ view: 'back', role: r, x: 170 + i * 225, y: 950, scale: 1.5, start: p, seed: i + 4 })),
    caption(BACKS.map(([p, r], i) => [170 + i * 225, r === 'main' ? p : r]), 995),
    label(),
  ],
};

/* ------------------------------------------------------------------ */
/* Props                                                               */
/* ------------------------------------------------------------------ */
const propsA = (() => {
  const k = 1.5, r1 = 500, r2 = 940;
  const desk = new UF.Prop({ type: 'desk', x: 580, y: r1, scale: k });
  const wood = new UF.Prop({ type: 'desk', style: 'wood', length: 120, x: 1190, y: r1, scale: k });
  const table = new UF.Prop({ type: 'desk', style: 'table', length: 100, x: 1480, y: r1, scale: k });
  const dt = desk.point('top'), wt = wood.point('top'), tt = table.point('top');
  return {
    id: 'props-furniture', title: 'Props — furniture, machines, bags', duration: 8,
    layers: [
      new UF.Room({ floor: r2 }),
      heading('PROPS', 'Furniture · machines · bags'),
      shelf(r1),
      new UF.Prop({ type: 'atm', x: 120, y: r1, scale: k, screens: [{ at: 2, screen: 'wait' }, { at: 4, screen: 'approved' }] }),
      new UF.Prop({ type: 'serverRack', x: 300, y: r1, scale: k, label: 'CORE-02', alarm: 4 }),
      desk,
      new UF.Prop({ type: 'lamp', x: dt[0] - 95, y: dt[1], scale: k }),
      new UF.Prop({ type: 'monitor', x: dt[0] + 10, y: dt[1], scale: k }),
      new UF.Prop({ type: 'mug', x: dt[0] + 75, y: dt[1], scale: k }),
      new UF.Prop({ type: 'chair', x: 820, y: r1, scale: k }),
      new UF.Prop({ type: 'chair', style: 'plastic', x: 960, y: r1, scale: k }),
      wood,
      new UF.Prop({ type: 'laptop', x: wt[0], y: wt[1], scale: k }),
      table,
      new UF.Prop({ type: 'deskPhone', x: tt[0] - 30, y: tt[1], scale: k, ring: [{ at: 1, dur: 3 }] }),
      new UF.Prop({ type: 'cardWriter', x: tt[0] + 35, y: tt[1], scale: k, swipes: [1.5, 4.5] }),
      new UF.Prop({ type: 'wallClock', x: 1750, y: 330, scale: k, size: 2, spin: { from: '09:00', to: '17:30', at: 0.5, dur: 6 } }),
      caption([[120, 'atm'], [300, 'serverRack'], [580, 'desk · lamp · monitor · mug'], [820, 'chair'], [960, 'chair plastic'],
               [1190, 'desk wood · laptop'], [1480, 'table · deskPhone · cardWriter'], [1750, 'wallClock']], r1 + 40),
      new UF.Prop({ type: 'backpack', x: 120, y: r2, scale: k }),
      new UF.Prop({ type: 'duffel', x: 290, y: r2, scale: k, open: true }),
      new UF.Prop({ type: 'paperStack', x: 470, y: r2, scale: k, size: 2, title: 'CHARGE SHEET' }),
      new UF.Prop({ type: 'cash', style: 'stack', x: 650, y: r2, scale: k, size: 2, count: 9, cols: 3 }),
      new UF.Prop({ type: 'monitor', view: 'side', x: 800, y: r2, scale: k }),
      new UF.Prop({ type: 'monitor', view: 'back', x: 900, y: r2, scale: k }),
      new UF.Prop({ type: 'laptop', view: 'side', x: 1030, y: r2, scale: k, size: 1.4 }),
      new UF.Prop({ type: 'laptop', view: 'back', x: 1130, y: r2, scale: k, size: 1.4 }),
      new UF.Prop({ type: 'cctv', x: 1270, y: 800, scale: k, size: 2.2 }),
      new UF.Prop({ type: 'notice', x: 1480, y: 810, scale: k, size: 1.8, title: 'NOTICE', text: 'ATM OUT OF SERVICE\nWE APOLOGISE FOR\nTHE INCONVENIENCE' }),
      new UF.Prop({ type: 'clapperboard', x: 1730, y: 830, scale: k, size: 2.4, clap: 3, fields: { scene: '12', take: '3', roll: 'A004', date: '28.10.26' } }),
      caption([[120, 'backpack'], [290, 'duffel open'], [470, 'paperStack'], [650, 'cash stack'], [850, 'monitor side/back'],
               [1080, 'laptop side/back'], [1270, 'cctv'], [1480, 'notice'], [1730, 'clapperboard']], r2 + 40),
      label(),
    ],
  };
})();

const propsB = (() => {
  const k = 1.5, X = c => 190 + c * 305, Y = r => 270 + r * 290;
  const cell = (c, r, o) => new UF.Prop(Object.assign({ x: X(c), y: Y(r), scale: k }, o));
  const names = [
    ['card bank', 'card back', 'card blank', 'cardStack', 'cardWriter', 'cash note'],
    ['cash bundle', 'cash fan', 'mobile lock', 'mobile call', 'mobile otp', 'receipt'],
    ['envelope', 'document', 'wallClock', 'stopwatch', 'ceilingFan', 'handset'],
  ];
  return {
    id: 'props-small', title: 'Props — cards, cash, phones, paper', duration: 8,
    layers: [
      new UF.Background({ style: 'void' }),
      heading('PROPS', 'Hand-sized items · shown enlarged'),
      cell(0, 0, { type: 'card', size: 10 }),
      cell(1, 0, { type: 'card', side: 'back', size: 10 }),
      cell(2, 0, { type: 'card', style: 'blank', size: 10 }),
      cell(3, 0, { type: 'cardStack', size: 9 }),
      cell(4, 0, { type: 'cardWriter', y: Y(0) + 40, size: 5, swipes: [1, 3, 5] }),
      cell(5, 0, { type: 'cash', style: 'note', size: 7 }),
      cell(0, 1, { type: 'cash', style: 'bundle', size: 7 }),
      cell(1, 1, { type: 'cash', style: 'fan', size: 6 }),
      cell(2, 1, { type: 'mobile', size: 6.5, content: 'lock' }),
      cell(3, 1, { type: 'mobile', size: 6.5, content: 'call', text: 'UNKNOWN NUMBER' }),
      cell(4, 1, { type: 'mobile', size: 6.5, content: 'otp' }),
      cell(5, 1, { type: 'receipt', size: 8 }),
      cell(0, 2, { type: 'envelope', size: 5 }),
      cell(1, 2, { type: 'document', size: 3.6, title: 'ACCOUNT STATEMENT', redact: [2, 3, 8], stamp: 'CONFIDENTIAL' }),
      cell(2, 2, { type: 'wallClock', size: 3.4, spin: { from: '22:00', to: '02:00', at: 1, dur: 5 } }),
      cell(3, 2, { type: 'stopwatch', size: 6, run: { at: 0.5, dur: 7, from: 0, to: 2 * 3600 + 13 * 60 } }),
      cell(4, 2, { type: 'ceilingFan', y: Y(2) - 70, size: 1.3 }),
      cell(5, 2, { type: 'handset', size: 6 }),
      ...names.map((row, r) => caption(row.map((n, c) => [X(c), n]), Y(r) + 125)),
      label(),
    ],
  };
})();

/* ------------------------------------------------------------------ */
/* Set-ups                                                             */
/* ------------------------------------------------------------------ */
const atmDemo = (() => {
  const card = { type: 'card', style: 'blank' };
  const atm = new UF.Prop({
    type: 'atm', x: 1210, y: 960, scale: 3.0,
    screens: [{ at: 2.0, screen: 'pin' }, { at: 3.9, screen: 'wait' }, { at: 5.4, screen: 'approved', kick: { flash: 0.12 } }],
    card: { in: 1.5, out: 5.7, taken: 6.5 }, typing: { at: 2.3, dur: 1.4 }, dispense: [{ at: 7.0, take: 8.4 }],
  });
  return {
    id: 'atm', title: 'Set-up — mule at an ATM (back view, over the shoulder)', duration: 12,
    layers: [
      new UF.Room({ floor: 960, wall: '#14181e' }),
      new UF.Prop({ type: 'cctv', x: 150, y: 150, scale: 2.6, size: 1.4 }),
      atm,
      new UF.Character({ role: 'mule', view: 'back', x: 1090, y: 1130, scale: 3.9, hold: card, actions: [
        { at: 0.8, pose: 'reach', target: atm.point('slot') },
        { at: 1.5, hold: null },
        { at: 1.9, pose: 'stand' },
        { at: 2.2, pose: 'type', target: atm.point('keypad') },
        { at: 3.8, pose: 'stand' },
        { at: 5.9, pose: 'reach', target: atm.point('slot') },
        { at: 6.5, hold: card },
        { at: 6.8, pose: 'stand' },
        { at: 7.2, hold: null, holdFar: card },
        { at: 7.6, pose: 'reach', target: atm.point('cash') },
        { at: 8.4, hold: { type: 'cash', style: 'bundle' } },
        { at: 8.9, pose: 'stand' },
        { at: 9.5, view: 'side', facing: -1 },
        { at: 9.9, to: -300 },
      ] }),
      label('DRAMATISATION'),
    ],
  };
})();

const deskDemo = (() => {
  const chair = new UF.Prop({ type: 'chair', x: 830, y: F });
  const desk = new UF.Prop({ type: 'desk', x: 1110, y: F, length: 150 });
  const top = desk.point('top');
  const phone = new UF.Prop({ type: 'deskPhone', x: 1030, y: top[1], ring: [{ at: 4.6, dur: 2 }], lifted: 6.6 });
  return {
    id: 'desk', title: 'Set-up — bank officer at a desk; time passes; the phone rings', duration: 10,
    layers: [
      new UF.Room({ floor: F, window: { x: 180, y: 200, w: 300, h: 320 } }),
      new UF.Prop({ type: 'wallClock', x: 640, y: 360, size: 1.3, spin: { from: '10:00', to: '17:45', at: 0.5, dur: 3.2 } }),
      chair,
      desk,
      new UF.Prop({ type: 'lamp', x: 1330, y: top[1], flip: true }),
      new UF.Prop({ type: 'monitor', x: 1170, y: top[1], content: 'dashboard', glow: true }),
      new UF.Prop({ type: 'mug', x: 1095, y: top[1] }),
      new UF.Prop({ type: 'keyboard', length: 36, x: 945, y: top[1] }),
      phone,
      new UF.Character({ role: 'staff', x: chair.point('seat')[0], y: F, start: 'sitType', actions: [
        { at: 5.4, pose: 'sit' },
        { at: 5.9, pose: 'sit', target: phone.point('handset') },
        { at: 6.6, pose: 'sitPhone', hold: 'handset', blend: 0.5 },
      ] }),
      label('DRAMATISATION'),
    ],
  };
})();

const handlerDemo = (() => {
  const chair = new UF.Prop({ type: 'chair', style: 'plastic', x: 760, y: F });
  const table = new UF.Prop({ type: 'desk', style: 'table', length: 100, x: 960, y: F });
  const top = table.point('top');
  const swap = [870, 590];
  const bundle = { type: 'cash', style: 'bundle' };
  return {
    id: 'handler', title: 'Set-up — handler pays a mule across a table', duration: 10,
    layers: [
      new UF.Room({ floor: F, wall: '#121418', window: { x: 1380, y: 180, w: 280, h: 300 } }),
      new UF.Prop({ type: 'ceilingFan', x: 960, y: 0 }),
      new UF.Character({ role: 'mule', x: 2050, y: F, facing: -1, actions: [
        { at: 0.6, to: 990 },
        { at: 5.3, pose: 'receive', target: swap },
        { at: 6.2, hold: bundle },
        { at: 6.7, pose: 'pocket' },
        { at: 7.4, hold: null },
        { at: 7.8, to: 2100 },
      ] }),
      chair,
      table,
      new UF.Prop({ type: 'laptop', view: 'side', x: top[0] - 80, y: top[1], glow: true }),
      new UF.Character({ role: 'handler', x: chair.point('seat')[0], y: F, start: 'sitLaptop', seat: 45, actions: [
        { at: 4.5, pose: 'sit', target: swap, hold: bundle },
        { at: 6.2, hold: null },
        { at: 6.7, pose: 'sitLaptop' },
      ] }),
      label('DRAMATISATION'),
    ],
  };
})();

new UF.Stage({
  title: 'UNFICTION · CAST AND PROPS',
  slug: 'uf-cast',
  scenes: [turnaround, closeup, roles, sidePoses, sitPoses, walk, frontBack, propsA, propsB, atmDemo, deskDemo, handlerDemo],
});
</script>
</body>
</html>
