<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unfiction — Thumbnail template</title>
<!--
  Thumbnail designs, one per scene. Each is a single UF.Thumbnail layer with transition 'cut' and
  pushIn 0, so every frame of the scene is the finished design.

  Save them as 1280x720 JPEGs under YouTube's 2 MB limit:
    - on the page: pick the scene, press T
    - from the shell: python ../tools/thumbnail.py thumbnail-template.html OUT_DIR 1@1 2@1 3@1

  For a real person's photo: embed it with tools/embed_images.py, pass image: 'name', and set their
  legal status (status: 'charged' and so on). Leave person at its default of true so the editorial
  check can flag a guilt word stamped beside them. YouTube covers the bottom-right corner with the
  video length, so keep text and faces out of it.
-->
<script src="../core/uf-core.js"></script>
<script src="../core/uf-draw.js"></script>
<script src="../components/uf-overlays.js"></script>
<script src="../components/uf-thumbnail.js"></script>
</head>
<body>
<script>
'use strict';

/* A drawn hooded figure in monitor light: an illustration, not a photo of anyone. */
function hoodedFigure() {
  const cv = document.createElement('canvas');
  cv.width = 1080; cv.height = 1080;
  const x = cv.getContext('2d');
  const bg = x.createRadialGradient(540, 420, 40, 540, 420, 760);
  bg.addColorStop(0, '#4a5a6e'); bg.addColorStop(1, '#0b0e12');
  x.fillStyle = bg; x.fillRect(0, 0, 1080, 1080);
  x.fillStyle = '#12161c';
  x.beginPath();
  x.moveTo(90, 1080);
  x.bezierCurveTo(110, 820, 300, 720, 540, 720);
  x.bezierCurveTo(780, 720, 970, 820, 990, 1080);
  x.closePath(); x.fill();
  x.beginPath(); x.ellipse(540, 470, 235, 285, 0, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#030405';
  x.beginPath(); x.ellipse(540, 520, 138, 178, 0, 0, Math.PI * 2); x.fill();
  x.strokeStyle = 'rgba(160,200,255,.7)'; x.lineWidth = 8;
  x.beginPath(); x.ellipse(540, 470, 235, 285, 0, Math.PI * 0.95, Math.PI * 1.55); x.stroke();
  const glow = x.createLinearGradient(0, 1080, 0, 640);
  glow.addColorStop(0, 'rgba(70,130,255,.32)'); glow.addColorStop(1, 'rgba(70,130,255,0)');
  x.fillStyle = glow; x.fillRect(0, 640, 1080, 440);
  return cv.toDataURL('image/jpeg', 0.92);
}
UF.addImages({ hoodedFigure: hoodedFigure() });

const thumb = (id, title, opts) => ({ id, title, duration: 2, transition: 'cut', pushIn: 0, layers: [new UF.Thumbnail(opts)] });

new UF.Stage({
  title: 'UNFICTION · THUMBNAILS',
  slug: 'uf-thumbnails',
  scenes: [
    thumb('one-word', 'Headline + stamp, no image', {
      kicker: 'BANGLADESH BANK · 2016', headline: 'ONE WORD STOPPED $850 MILLION', highlight: 'ONE WORD',
      stamp: 'BLOCKED', background: 'grid',
    }),
    thumb('hooded', 'Headline + subject image (illustration)', {
      kicker: 'HOW HACKERS ROBBED A CENTRAL BANK', headline: 'THE $81M HEIST', highlight: '$81M',
      image: 'hoodedFigure', person: false, label: 'ILLUSTRATION', mono: true, background: 'void',
    }),
    thumb('typo', 'Centred headline, amber accent', {
      kicker: 'EPISODE 1', headline: 'ONE TYPO SAVED $20 MILLION', highlight: 'ONE TYPO',
      side: 'center', accent: 'amber', background: 'desk',
    }),
  ],
});
</script>
</body>
</html>
